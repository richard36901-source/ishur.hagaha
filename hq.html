<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>HQ · ishur.io</title>
<link rel="icon" type="image/png" sizes="128x128" href="assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js?v=71"></script>
<script src="assets/ux.js?v=4"></script>
<script src="assets/adminbar.js?v=13" defer></script>
<script src="assets/guard.js?v=19"></script>
<style>
  /* One screen that answers, top to bottom: is anything broken · what needs
     me · what is happening today · what is coming · leads · money.
     Calm paper, pine accent, red only where a hand is needed. */
  :root{--ink:#1B2620;--ink2:#4E5C55;--ink3:#7F8C86;--paper:#FBFAF7;--card:#fff;--line:#E1E4DE;--pine:#0F4C35;--pine-s:rgba(15,76,53,.09);--gold:#B4884A;--warn:#A8402F;--warn-s:rgba(168,64,47,.10);--good:#2E7D5B;--good-s:rgba(46,125,91,.12);--amber:#9A5B00;--amber-s:rgba(154,91,0,.12);--rail:#F0EFE9}
  html[data-theme=dark]{--ink:#E8EBE7;--ink2:#C2C9C1;--ink3:#8D968C;--paper:#131714;--card:#1A201C;--line:#2A322C;--pine:#7BC9A4;--pine-s:rgba(123,201,164,.14);--rail:#232A25;--good:#7BC9A4;--warn:#E58C7C;--amber:#E3AA4C}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Heebo',sans-serif;font-size:15px;line-height:1.5}
  .wrap{max-width:1140px;margin:0 auto;padding:1.3rem 1rem 5rem}
  h1{font-family:'Frank Ruhl Libre',serif;color:var(--pine);font-size:1.7rem;margin:0;letter-spacing:-.01em}
  .sub{color:var(--ink3);font-size:.84rem;margin:.15rem 0 1.1rem}
  h2{font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:1.6rem 0 .55rem}
  h2 a{color:var(--ink3);text-decoration:none;font-weight:500;letter-spacing:0;text-transform:none;margin-inline-start:.5rem}
  h2 a:hover{color:var(--pine)}
  /* status strip */
  .strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.6rem}
  .st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.75rem .9rem;display:flex;flex-direction:column;gap:.15rem;min-height:4.6rem}
  .st .l{font-size:.74rem;color:var(--ink3)}
  .st .v{font-size:1.05rem;font-weight:600;display:flex;align-items:center;gap:.45rem}
  .st .d{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--ink3)}
  .st.ok .d{background:var(--good)}.st.warn .d{background:var(--amber)}.st.bad .d{background:var(--warn)}
  .st .m{font-size:.74rem;color:var(--ink2)}
  /* needs-me list */
  .todo{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .todo .row{display:flex;gap:.7rem;align-items:flex-start;padding:.7rem .95rem;border-bottom:1px solid var(--line)}
  .todo .row:last-child{border-bottom:none}
  .todo .k{width:8px;height:8px;border-radius:50%;margin-top:.5rem;flex-shrink:0;background:var(--warn)}
  .todo .k.amber{background:var(--amber)}
  .todo .t{font-weight:600;font-size:.92rem}
  .todo .s{font-size:.78rem;color:var(--ink2)}
  .todo .a{margin-inline-start:auto;flex-shrink:0}
  .todo .empty{padding:1.1rem;text-align:center;color:var(--ink3);font-size:.86rem}
  .btn{font:inherit;font-size:.78rem;font-weight:600;padding:.32rem .7rem;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--ink3)}
  .btn.p{background:var(--pine);border-color:var(--pine);color:#fff}
  /* events */
  .ev{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.8rem .95rem;display:grid;grid-template-columns:1fr auto;gap:.3rem .8rem;margin-bottom:.55rem}
  .ev .n{font-weight:600}
  .ev .w{font-size:.78rem;color:var(--ink2)}
  .ev .date{font-size:.8rem;color:var(--ink3);text-align:left;white-space:nowrap}
  .ev .date b{display:block;font-size:1.05rem;color:var(--ink);font-weight:600}
  .bar{grid-column:1/-1;height:7px;border-radius:999px;background:var(--rail);overflow:hidden;display:flex}
  .bar i{display:block;height:100%}
  .bar .c{background:var(--good)}.bar .d{background:var(--warn)}.bar .u{background:var(--gold)}
  .legend{grid-column:1/-1;font-size:.72rem;color:var(--ink3);display:flex;gap:.9rem;flex-wrap:wrap}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:.3rem;vertical-align:middle}
  /* two-column tail */
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
  @media (max-width:760px){.cols{grid-template-columns:1fr}}
  .kp{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
  .k{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.65rem .8rem}
  .k b{display:block;font-size:1.35rem;font-weight:600;letter-spacing:-.01em}
  .k span{font-size:.72rem;color:var(--ink3)}
  .k.hot b{color:var(--warn)}
  .leadrow{display:flex;justify-content:space-between;gap:.6rem;padding:.45rem 0;border-bottom:1px solid var(--line);font-size:.86rem}
  .leadrow:last-child{border-bottom:none}
  .leadrow .who{font-weight:600}
  .leadrow .src{font-size:.74rem;color:var(--ink3)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.8rem .95rem}
  .gate{max-width:340px;margin:4rem auto;text-align:center}
  .gate input{width:100%;padding:.7rem;font:inherit;border:1px solid var(--line);border-radius:10px;text-align:center;direction:ltr;margin:.6rem 0}
  .gate button{width:100%;padding:.7rem;font:inherit;border:none;border-radius:10px;background:var(--pine);color:#fff}
  .skel{color:transparent;background:linear-gradient(90deg,var(--rail),var(--line),var(--rail));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:6px}
  @keyframes sh{to{background-position:-200% 0}}
  @media (prefers-reduced-motion:reduce){.skel{animation:none}}
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <h2 style="text-transform:none;letter-spacing:0;font-size:1.1rem;color:var(--ink)">כניסת ניהול</h2>
  <input type="password" id="keyIn" placeholder="מפתח גישה" autocomplete="off">
  <button id="keyGo">כניסה</button>
  <p style="font-size:.75rem"><a href="admin-login.html" style="color:var(--gold)">או כניסה עם קוד</a></p>
</div>
<main class="wrap" id="main" hidden>
  <h1 id="hello">בוקר טוב</h1>
  <p class="sub" id="today"></p>

  <div class="strip" id="strip">
    <div class="st" id="s-send"><span class="l">שליחות</span><span class="v"><i class="d"></i><span class="skel">בודק</span></span><span class="m"></span></div>
    <div class="st" id="s-shir"><span class="l">שיר · שיחות</span><span class="v"><i class="d"></i><span class="skel">בודק</span></span><span class="m"></span></div>
    <div class="st" id="s-noa"><span class="l">נועה · לקוחות</span><span class="v"><i class="d"></i><span class="skel">בודק</span></span><span class="m"></span></div>
    <div class="st" id="s-ads"><span class="l">מודעות</span><span class="v"><i class="d"></i><span class="skel">בודק</span></span><span class="m"></span></div>
  </div>

  <h2>דורש אותך <a href="ops.html">יומן מלא ›</a></h2>
  <div class="todo" id="todo"><div class="empty skel">טוען</div></div>

  <h2>אירועים קרובים <a href="calendar.html">לוח שליחות ›</a><a href="clients.html">כל הלקוחות ›</a></h2>
  <div id="events"></div>

  <div class="cols">
    <div>
      <h2>לידים <a href="leads.html">לוח לידים ›</a></h2>
      <div class="kp" id="leadkp"></div>
      <div class="card" style="margin-top:.6rem" id="leadlist"></div>
    </div>
    <div>
      <h2>כסף <a href="admin.html">מרכז הבקרה ›</a></h2>
      <div class="kp" id="moneykp"></div>
      <div class="card" style="margin-top:.6rem;font-size:.84rem;color:var(--ink2)" id="moneynote"></div>
    </div>
  </div>
</main>
<script>
(function () {
  var CFG = window.ISHUR_CONFIG, $ = function (id) { return document.getElementById(id); };
  var adminKey = '';
  var qk = new URLSearchParams(location.search).get('key');
  if (qk) { try { localStorage.setItem('ishur_calls_key', qk); } catch (e) {} history.replaceState(null, '', location.pathname); }
  try { adminKey = localStorage.getItem('ishur_calls_key') || ''; } catch (e) {}
  var BASE = CFG.endpoint('status').replace(/\/api\/status$/, '');
  function api(path, body) {
    var payload = Object.assign({ admin_key: adminKey }, body || {});
    return fetch(BASE + '/api/' + path, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(window.IshurGuard ? IshurGuard.stamp(payload) : payload) })
      .then(function (r) { if (r.status === 403) throw new Error('403'); return r.json(); });
  }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function heDay(iso) { var d = new Date(iso + 'T12:00:00'); return isNaN(d) ? iso : d.toLocaleDateString('he-IL', { weekday: 'short', day: 'numeric', month: 'short' }); }
  function daysTo(iso) { var d = new Date(iso + 'T12:00:00'), n = new Date(); n.setHours(12, 0, 0, 0); return Math.round((d - n) / 864e5); }
  function setSt(id, cls, v, m) { var el = $(id); el.className = 'st ' + cls; el.querySelector('.v').innerHTML = '<i class="d"></i>' + esc(v); el.querySelector('.m').textContent = m || ''; }
  function greet() { var h = new Date().getHours(); return h < 5 ? 'לילה טוב' : h < 12 ? 'בוקר טוב' : h < 17 ? 'צהריים טובים' : h < 21 ? 'ערב טוב' : 'לילה טוב'; }

  function load() {
    if (!adminKey) { $('gate').hidden = false; $('main').hidden = true; return; }
    $('gate').hidden = true; $('main').hidden = false;
    $('hello').textContent = greet() + ', ריצארד';
    $('today').textContent = new Date().toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long' });

    var todo = [];
    function pushTodo(kind, t, s, href, label) { todo.push({ kind: kind, t: t, s: s, href: href, label: label }); }

    /* 1 · sending: paused? cap? held events with a wave due */
    Promise.all([api('pause', {}), api('wave-audit', {})]).then(function (r) {
      var paused = r[0] && r[0].paused, au = r[1] || {}, evs = au.events || [];
      var missing = evs.filter(function (e) { return e.missing_n > 0 && !e.held; });
      var held = evs.filter(function (e) { return e.held; });
      if (paused) setSt('s-send', 'bad', 'מושהה', 'כל השליחות עצורות ידנית');
      else if (missing.length) setSt('s-send', 'warn', missing.length + ' אירועים חסרים', 'יש מוזמנים שלא קיבלו הזמנה');
      else setSt('s-send', 'ok', 'כל ההזמנות יצאו', evs.length + ' אירועים חיים · 0 חסרים');
      missing.forEach(function (e) { pushTodo('bad', e.name + ' — ' + e.missing_n + ' מוזמנים בלי הזמנה', 'גל 1 היה אמור לצאת ב-' + e.wave1, 'calendar.html', 'ללוח'); });
      held.forEach(function (e) { if (e.missing_n) pushTodo('amber', e.name + ' בהשהיה — ' + e.missing_n + ' מוזמנים מחכים', 'שחרור מדף הלקוחות (חידוש הלקוח)', 'clients.html', 'ללקוחות'); });
      renderEvents(evs);
    }).catch(function () { setSt('s-send', 'warn', 'לא נטען', ''); });

    /* 2 · Shir */
    api('call-board', {}).then(function (b) {
      var w = (b.waiting || []).length, done = b.done || [];
      var today = new Date().toDateString();
      var td = done.filter(function (c) { return c.at && new Date(c.at).toDateString() === today; });
      var ans = td.filter(function (c) { return c.outcome && c.outcome !== 'לא ברור'; }).length;
      var win = b.window && b.window.open === false ? 'חלון חיוג סגור' : 'חלון חיוג פתוח';
      setSt('s-shir', w ? 'ok' : 'ok', w + ' בתור', td.length + ' שיחות היום · ' + ans + ' עם תשובה · ' + win);
      var probs = done.filter(function (c) { return c.state === 'problem' && c.kind !== 'inbound'; }).length;
    }).catch(function () { setSt('s-shir', 'warn', 'לא נטען', ''); });

    /* 3 · Noa + 4 · ads from the journal + ads health */
    Promise.all([api('evlog', { n: 400 }), api('ads-health', {})]).then(function (r) {
      var rows = (r[0] && r[0].rows) || [], ah = r[1] || {};
      var d = new Date(), stamp = String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
      var todayRows = rows.filter(function (x) { return String(x[0] || '').indexOf(stamp) === 0; });
      var noa131042 = todayRows.filter(function (x) { return /131042/.test(x.join(' ')); }).length;
      var inbound = todayRows.filter(function (x) { return /נועה כבויה/.test(x[2] || ''); }).length;
      if (noa131042) setSt('s-noa', 'bad', 'חסומה', 'חשבון התשלום של מטא · ' + inbound + ' הודעות נכנסו היום ולא נענו');
      else setSt('s-noa', 'ok', 'שולחת', inbound + ' הודעות נכנסו היום');
      var issues = (ah.issues || []).length, acct = ah.account || {};
      if (!ah.ok) setSt('s-ads', 'warn', 'לא נטען', '');
      else if (Number(acct.status) !== 1 || issues) setSt('s-ads', 'bad', issues ? issues + ' בעיות' : 'חשבון לא פעיל', (ah.campaign || {}).name || '');
      else setSt('s-ads', 'ok', 'רץ', ((ah.campaign || {}).effective_status || '') + ' · ' + (acct.funding || ''));
      /* red rows that need a human: dedupe by action text */
      var seen = {};
      todayRows.filter(function (x) { return x[4] === 'כן'; }).reverse().forEach(function (x) {
        var key = (x[1] || '') + '|' + String(x[2] || '').slice(0, 40);
        if (seen[key]) return; seen[key] = 1;
        if (/131049|130472|131026|131047|131048/.test(x.join(' '))) return; // Meta's no-action codes
        pushTodo('amber', (x[1] || '') + ' · ' + (x[2] || ''), String(x[8] || '').slice(0, 120) + ' · ' + String(x[0] || '').slice(11, 16), 'ops.html', 'ליומן');
      });
      renderTodo(todo);
    }).catch(function () { setSt('s-noa', 'warn', 'לא נטען', ''); setSt('s-ads', 'warn', 'לא נטען', ''); renderTodo(todo); });

    /* 5 · leads */
    api('leads', {}).then(function (d) {
      var c = d.counts || {}, ls = d.leads || [];
      $('leadkp').innerHTML =
        '<div class="k' + (c['חדש'] ? ' hot' : '') + '"><b>' + (c['חדש'] || 0) + '</b><span>חדשים</span></div>' +
        '<div class="k"><b>' + (c['לא ענה'] || 0) + '</b><span>לא ענו</span></div>' +
        '<div class="k' + (c.followupDue ? ' hot' : '') + '"><b>' + (c.followupDue || 0) + '</b><span>מעקב להיום</span></div>';
      var recent = ls.filter(function (l) { return l.status === 'חדש'; }).slice(0, 5);
      $('leadlist').innerHTML = recent.length ? recent.map(function (l) {
        return '<div class="leadrow"><span><span class="who">' + esc(l.name || l.phone.replace(/^972/, '0')) + '</span> <span class="src">' + esc(l.sourceKind || '') + (l.occasion ? ' · ' + esc(l.occasion) : '') + '</span></span><span class="src">' + esc(l.date || '') + '</span></div>';
      }).join('') : '<div style="color:var(--ink3);font-size:.84rem">אין לידים חדשים שמחכים.</div>';
      if (c['חדש']) pushTodo('amber', c['חדש'] + ' לידים חדשים מחכים לשיחה', 'לוח הלידים · סטטוס "חדש"', 'leads.html', 'ללידים');
    }).catch(function () {});

    /* 6 · money */
    api('status', { view: 'biz' }).then(function (d) {
      var m = d.money || {}, f = d.funnel || {}, evs = d.events || [];
      var month = new Date().toISOString().slice(0, 7);
      var monthEvs = evs.filter(function (e) { return e.paid && !e.cancelled && String(e.paid_at || '').slice(0, 7) === month; });
      var monthRev = monthEvs.reduce(function (s, e) { return s + (Number(e.sum) || 0); }, 0);
      $('moneykp').innerHTML =
        '<div class="k"><b>₪' + monthRev.toLocaleString('he-IL') + '</b><span>החודש</span></div>' +
        '<div class="k"><b>' + monthEvs.length + '</b><span>רכישות החודש</span></div>' +
        '<div class="k"><b>' + (f.conversion || 0) + '%</b><span>המרה מלידים</span></div>';
      $('moneynote').textContent = 'סה"כ ' + (f.paid_events || 0) + ' אירועים בתשלום · ₪' + Number(m.revenue_ils || 0).toLocaleString('he-IL') + ' מצטבר. CAC ודוח קמפיין במרכז הבקרה.';
    }).catch(function () {});
  }

  function renderTodo(list) {
    var el = $('todo');
    if (!list.length) { el.innerHTML = '<div class="empty">שקט. שום דבר לא מחכה לך עכשיו.</div>'; return; }
    el.innerHTML = list.slice(0, 12).map(function (t) {
      return '<div class="row"><i class="k ' + (t.kind === 'amber' ? 'amber' : '') + '"></i><div><div class="t">' + esc(t.t) + '</div><div class="s">' + esc(t.s) + '</div></div>' +
        (t.href ? '<a class="btn a" href="' + t.href + '">' + esc(t.label || 'פתח') + '</a>' : '') + '</div>';
    }).join('');
  }
  function renderEvents(evs) {
    var el = $('events');
    var up = evs.filter(function (e) { return e.date && daysTo(e.date) >= -1; }).sort(function (a, b) { return a.date < b.date ? -1 : 1; }).slice(0, 8);
    if (!up.length) { el.innerHTML = '<div class="card" style="color:var(--ink3)">אין אירועים קרובים עם רשימה.</div>'; return; }
    el.innerHTML = up.map(function (e) {
      var g = e.guests || 0, c = e.answered || 0, dead = e.dead || 0, un = Math.max(0, (e.sent || 0) - c), dt = daysTo(e.date);
      var pc = function (n) { return g ? Math.round(n / g * 100) : 0; };
      return '<div class="ev"><div><div class="n">' + esc(e.name) + (e.held ? ' <span style="font-size:.72rem;color:var(--amber)">· בהשהיה</span>' : '') + '</div>' +
        '<div class="w">' + g + ' מוזמנים · ' + c + ' ענו (' + pc(c) + '%) · ' + (e.sent || 0) + ' קיבלו הזמנה' + (e.missing_n ? ' · <b style="color:var(--warn)">' + e.missing_n + ' לא קיבלו</b>' : '') + '</div></div>' +
        '<div class="date"><b>' + (dt === 0 ? 'היום' : dt === 1 ? 'מחר' : 'בעוד ' + dt + ' ימים') + '</b>' + heDay(e.date) + '</div>' +
        '<div class="bar"><i class="c" style="width:' + pc(c) + '%"></i><i class="u" style="width:' + pc(un) + '%"></i><i class="d" style="width:' + pc(dead) + '%"></i></div>' +
        '<div class="legend"><span><i style="background:var(--good)"></i>ענו</span><span><i style="background:var(--gold)"></i>קיבלו, טרם ענו</span><span><i style="background:var(--warn)"></i>לא בוואטסאפ</span></div></div>';
    }).join('');
  }

  $('keyGo').addEventListener('click', function () { adminKey = $('keyIn').value.trim(); if (!adminKey) return; try { localStorage.setItem('ishur_calls_key', adminKey); } catch (e) {} load(); });
  window.addEventListener('ishur:fresh', load);
  load();
})();
</script>
</body>
</html>
