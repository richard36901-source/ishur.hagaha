name = "ishur-webhooks"
main = "index.js"
# Adding [[routes]] silently disables the workers.dev hostname, and every page
# on the site calls it. Keep both alive.
workers_dev = true
compatibility_date = "2026-08-01"

# שיר — הסוכן שעונה לשיחות נכנסות. גם החזרה המהירה מדברת איתו, כי מי שחזרנו
# אליו התקשר אלינו, והתסריט היוצא ("שלחנו הזמנה ולא ראינו תשובה") לא מתאים לו.
# ריק = השיחה נופלת לסוכן היוצא, וזו בדיוק התקלה שהוסרה כאן.
# 04/11 incident: 'Too many API requests by single Worker invocation' silently dropped KV writes,
# run records and whole cron jobs. Paid accounts may raise this (default 10,000, max 10M).
[limits]
subrequests = 50000
cpu_ms = 120000

[vars]
SLACK_STRICT = "1"
SHIR_INBOUND_AGENT = "agent_c7d317f758ed084571630ce25e"

# נועה — קו הלקוחות והלידים, בבידוד מלא מקו האורחים של שיר. סוכנת המכירות
# היוצאת מחייגת מ-NOA_FROM ללידים שנטשו (התור lq:), והסוכנת הנכנסת עונה
# למי שמחזיר שיחה. NOA_LEADS="off" מכבה את החיוג היוצא בלי דיפלוי-קוד נוסף.
NOA_FROM = "+972555077733"
NOA_AGENT = "agent_dfc2c18968a9daea870caffbab"
NOA_INBOUND_AGENT = "agent_f86326fe9b9fd16233276ea951"
NOA_LEADS = "off"
# 02/11 נועה רודפת (noa-chase): לידים "לא ענה" במאנדיי → תור nq: + קדנציה של 5 ניסיונות,
# בקרת איכות אחרי כל שיחה (תיקון RSVP אוטומטי לשלושת המקרים החד-משמעיים), זיכרון {{memory}}.
# "off" = אין סריקה, אין חיוג, אין כתיבה למאנדיי ואין תיקונים — הכל נשאר קריאה בלבד.
NOA_CHASE = "on"

# מי רשאי לקבל קוד כניסה לניהול בוואטסאפ (admin-login.html). פסיקים בין מספרים.
SLACK_SHALEV = "U0C33AKDF24"
SLACK_RICHARD = "U0BTHU91Z3N"
# 26/09: 4499 inside the ishur.io portfolio (phone id 1404834546041914, WABA 2815615772154486). Flip CLIENT_PORTFOLIO to "on" once the number is registered there; "off" = old business.
CLIENT_PORTFOLIO = "off"
WA_PHONE_ID_CLIENT_NEW = "1404834546041914"
# 25/10: 4499 re-registered by coexistence QR, new phone id (WABA 1060242146337688, business AutoScale). Overrides the stale WA_PHONE_ID secret.
WA_PHONE_ID_CLIENT = "1218978741299669"
# 01/11: second guests number 055-3089799 on the same WABA 1378764257421712 — doubles the daily 250 cap; the Worker spreads guest sends across all ids here.
WA_PHONE_IDS_GUESTS = "1409632775565601"
# 11/11 (Richard): shared safety margin under the business cap 20 → 10 (budget.js guestBudgetMargin)
GUEST_BUDGET_MARGIN = "10"
ADMIN_PHONES = "972545764327,972526979535"
# 02/11: B2B outreach to venues (outreach.js). "off" = plan only, nothing leaves.
# Flip to "on" only after `npx wrangler email sending enable ishur.io` and after
# approving the first `plan` output on outreach.html.
OUTREACH_ENABLED = "off"

[[kv_namespaces]]
binding = "RATE"
id = "05a171c6b3cb46f2af7cc72b1ac19f14"

[ai]
binding = "AI"

# 06:35 UTC = בוקר בישראל כל השנה (08:35 חורף / 09:35 קיץ)
[triggers]
# 06:35 UTC — the daily engine · 09/10/16 UTC Tue = 12:00/13:00/19:00 IL — team reminders
# 17/18/19 UTC — Phase 7's daily-improve loop (20:00 IL) and the journal digest
# (21:00 IL), both DST-safe: the code checks the actual Israel hour on every
# one of these three ticks and only acts on the two that currently match —
# 17+18 UTC = 20:00+21:00 IL in summer, 18+19 UTC = 20:00+21:00 IL in winter.
crons = ["*/10 * * * *", "5-55/10 * * * *", "35 6 * * *", "0 4 * * *", "0 9,10,16 * * 2", "0 17 * * *", "0 18 * * *", "0 19 * * *"]

# ishur.io itself is on Bezeq's SecuringSam blocklist by exact name — the same
# TLS handshake passes with any other subdomain. Customer-facing links move
# here so a paying customer can actually open the thing they paid for.
[[routes]]
pattern = "go.ishur.io"
custom_domain = true

# The doctor writes "a new build went live" to the journal once per version.
[version_metadata]
binding = "CF_VERSION_METADATA"

# 22/10: call recordings + audit exports (audit.js)
[[r2_buckets]]
binding = "AUDIT_R2"
bucket_name = "ishur-audit"

# 02/11: Email Sending binding for outreach.js (richard@ishur.io). The ishur.io
# domain must be enabled once: `npx wrangler email sending enable ishur.io`.
[[send_email]]
name = "EMAIL"

# 03/11: ops center runs ledger (worker/ops-run.js). NOT created yet — run
# `bash worker/scripts/ops-d1-setup.sh` once before the next deploy; it creates
# the database, writes the real id here and applies migrations/0001_runs.sql.
# Until then the Worker writes runs to the KV ring buffer (opsrun:*).
# D1 ledger — enable once the API token has D1:Edit and ops-d1-setup.sh ran (until then: KV ring fallback)
# [[d1_databases]]
# binding = "OPS_DB"
# database_name = "ishur-ops"
# database_id = "REPLACE_WITH_ID_FROM_ops-d1-setup.sh"
# migrations_dir = "migrations"

# 03/11 change log: every `wrangler deploy` (and deploy.sh) first writes
# build-info.json {version_tag, commit, branch, date, commits since the last
# deploy}; the Worker bundles it and logs `deploy:<version>` (changes.js).
[build]
command = "node scripts/build-info.mjs"
