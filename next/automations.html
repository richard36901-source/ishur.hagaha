<style>
  :root{
    --pine:#0F2E22; --pine-deep:#0A2119; --gold:#A8853C; --gold-soft:#C7AE7A;
    --gold-pale:rgba(199,174,122,.3); --paper:#F8F4EA;
    --ink:#1B2420; --ink2:#4A554E; --ink3:#7A847C;
    --bg:#FAF8F1; --card:#fff; --line:#E3E1D8; --chip:#F1EEE4;
    --ok:#0F4C35; --warn:#A8402F; --amber:#9A6A12;
    --k-guest:#1F7A55; --k-client:#A8853C; --k-call:#2C6E9E; --k-slack:#7656A8; --k-internal:#7A847C; --k-trigger:#0F2E22;
    --edge:#C9C5B7; --edge-hi:#A8853C;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme=light]){
      --bg:#131714;--card:#1A201C;--line:#2A322C;--chip:#222A24;
      --ink:#E8EBE7;--ink2:#C2C9C1;--ink3:#8D968C;--gold:#C7AE7A;--ok:#4CAF82;--warn:#F08A8A;--amber:#E0B25A;
      --k-guest:#4CAF82;--k-client:#C7AE7A;--k-call:#6FA8D6;--k-slack:#A98BD8;--k-internal:#8D968C;--k-trigger:#7BC9A4;--edge:#3A443C;
    }
  }
  html[data-theme=dark]{
    --bg:#131714;--card:#1A201C;--line:#2A322C;--chip:#222A24;
    --ink:#E8EBE7;--ink2:#C2C9C1;--ink3:#8D968C;--gold:#C7AE7A;--ok:#4CAF82;--warn:#F08A8A;--amber:#E0B25A;
    --k-guest:#4CAF82;--k-client:#C7AE7A;--k-call:#6FA8D6;--k-slack:#A98BD8;--k-internal:#8D968C;--k-trigger:#7BC9A4;--edge:#3A443C;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Heebo',system-ui,sans-serif;background:var(--bg);color:var(--ink);direction:rtl;line-height:1.5;padding-bottom:3rem}
  .head{background:radial-gradient(130% 140% at 50% -30%,#17402F 0%,var(--pine) 60%,var(--pine-deep) 100%);color:var(--paper);padding:1rem 1rem 1.1rem;text-align:center;border-bottom:1px solid var(--gold-pale);position:relative}
  .head h1{font-family:'Frank Ruhl Libre',serif;font-size:1.3rem}
  .head h1 i{font-style:normal;color:var(--gold-soft)}
  .head p{font-size:.75rem;color:rgba(248,244,234,.65)}
  #themeTog{position:absolute;top:.75rem;left:.75rem;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:.9rem;background:rgba(248,244,234,.08);border:1px solid rgba(199,174,122,.35);color:#F8F4EA}
  .wrap{max-width:min(98vw,1500px);margin:0 auto;padding:0 16px}
  .banner{margin:.8rem 0 0;padding:.6rem .9rem;border-radius:12px;font-size:.82rem;border:1px dashed var(--amber);color:var(--amber);background:color-mix(in srgb,var(--amber) 8%,transparent)}
  .banner b{font-weight:700}
  .strip{display:flex;flex-wrap:wrap;gap:.4rem;margin:.8rem 0}
  .pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:.25rem .7rem;font-size:.74rem;color:var(--ink2);white-space:nowrap}
  .pill b{color:var(--ink);font-variant-numeric:tabular-nums}
  .pill.bad{border-color:var(--warn);color:var(--warn)} .pill.bad b{color:var(--warn)}
  .pill.good{border-color:var(--ok);color:var(--ok)}
  .tabs{display:flex;gap:.4rem;margin:.6rem 0;flex-wrap:wrap;align-items:center}
  .tab{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:10px;padding:.45rem 1rem;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
  .tab[aria-selected=true]{background:var(--pine);color:var(--paper);border-color:var(--pine)}
  html[data-theme=dark] .tab[aria-selected=true]{background:#7BC9A4;color:#0A2119}
  .tools{margin-inline-start:auto;display:flex;gap:.3rem;flex-wrap:wrap}
  .tool{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:8px;padding:.3rem .6rem;font:inherit;font-size:.75rem;cursor:pointer}
  .legend{display:flex;flex-wrap:wrap;gap:.7rem;font-size:.72rem;color:var(--ink3);margin:.3rem 0 .5rem}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:.3rem;vertical-align:-1px}
  .mapbox{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:auto;height:min(72vh,820px);touch-action:pan-x pan-y;
    background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:18px 18px}
  svg#map{display:block}
  .node{cursor:pointer}
  .node rect.box{fill:var(--card);stroke:var(--line);stroke-width:1.2}
  .node:hover rect.box,.node.sel rect.box{stroke:var(--gold);stroke-width:2}
  .node text{font-family:'Heebo',sans-serif;fill:var(--ink)}
  .node .t1{font-size:12.5px;font-weight:600}
  .node .t2{font-size:10.5px;fill:var(--ink3)}
  .node .warnmark{fill:var(--warn);font-size:12px;font-weight:700}
  .band text{font-family:'Heebo',sans-serif;font-size:12px;fill:var(--ink3);font-weight:600}
  .band rect{fill:none;stroke:var(--line);stroke-dasharray:4 4}
  path.edge{fill:none;stroke:var(--edge);stroke-width:1.4}
  path.edge.reopen{stroke:var(--warn);stroke-dasharray:5 4;opacity:.6}
  path.edge.hi{stroke:var(--edge-hi);stroke-width:2.2;opacity:1}
  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.5rem}
  .litem{background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--k-internal);border-radius:12px;padding:.6rem .75rem;cursor:pointer;text-align:start;font:inherit;color:inherit}
  .litem b{display:block;font-size:.88rem} .litem span{font-size:.72rem;color:var(--ink3)}
  /* side panel */
  .panel{position:fixed;top:0;bottom:0;left:0;width:min(470px,100vw);background:var(--card);border-inline-end:1px solid var(--line);box-shadow:0 0 40px rgba(0,0,0,.18);transform:translateX(-105%);transition:transform .2s ease;z-index:50;overflow-y:auto;padding:1rem 1rem 3rem}
  .panel.open{transform:none}
  .panel h3{font-family:'Frank Ruhl Libre',serif;font-size:1.1rem;color:var(--ink);margin-bottom:.2rem;padding-inline-end:2rem}
  .panel .x{position:absolute;top:.7rem;left:.7rem;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:1rem}
  .panel h4{font-size:.72rem;color:var(--gold);letter-spacing:.06em;margin:.9rem 0 .25rem;font-weight:700}
  .panel ul{padding-inline-start:1.1rem;font-size:.8rem;color:var(--ink2)} .panel li{margin:.12rem 0}
  .panel p{font-size:.8rem;color:var(--ink2)}
  .panel .warnbox{border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:.5rem .7rem;font-size:.78rem;margin-top:.6rem}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.72rem;background:var(--chip);color:var(--ink2);border-radius:5px;padding:.03rem .3rem;direction:ltr;display:inline-block;unicode-bidi:isolate;overflow-wrap:anywhere}
  a{color:var(--gold)}
  table.kv{width:100%;border-collapse:collapse;font-size:.78rem} table.kv td{padding:.25rem .3rem;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink2)} table.kv td:first-child{color:var(--ink3);white-space:nowrap;width:1%}
  /* timeline */
  .ev{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:.6rem 0;overflow:hidden}
  .ev-h{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;padding:.65rem .85rem;border-bottom:1px solid var(--line)}
  .ev-h b{font-size:.95rem} .ev-h .meta{font-size:.74rem;color:var(--ink3)}
  .ev-h .sp{flex:1}
  .hold{border:1px solid var(--warn);color:var(--warn);background:transparent;border-radius:9px;padding:.35rem .9rem;font:inherit;font-weight:700;font-size:.8rem;cursor:pointer}
  .hold:disabled{opacity:.45;cursor:default}
  .held{font-size:.74rem;color:var(--warn);font-weight:700}
  .tl{width:100%;border-collapse:collapse;font-size:.8rem}
  .tl th{font-size:.66rem;color:var(--gold);text-align:right;padding:.4rem .7rem;font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap}
  .tl td{padding:.45rem .7rem;border-bottom:1px solid var(--line);color:var(--ink2);vertical-align:top}
  .tl tr:last-child td{border-bottom:none}
  .tl td.n{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink);white-space:nowrap}
  .tl tr.isheld td{opacity:.55;text-decoration:line-through}
  .tblwrap{overflow-x:auto}
  .note{font-size:.72rem;color:var(--ink3)}
  .gate{max-width:340px;margin:4rem auto;text-align:center;padding:0 16px}
  .gate input{width:100%;border:1px solid var(--line);border-radius:10px;padding:.7rem .9rem;font:inherit;margin:.8rem 0 .5rem;text-align:center;direction:ltr;background:var(--card);color:var(--ink)}
  .gate button{width:100%;border:none;border-radius:10px;background:var(--pine);color:var(--paper);padding:.7rem;font:inherit;font-weight:600;cursor:pointer}
  .err{color:var(--warn);font-size:.82rem;margin-top:.5rem}
  .empty{text-align:center;color:var(--ink3);padding:2rem 1rem;font-size:.88rem}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--gold-pale);border-top-color:var(--gold);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-inline-end:.35rem}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}.panel{transition:none}}
  @media (max-width:640px){.mapbox{height:62vh}.head h1{font-size:1.1rem}}
</style>

<script>
(function () {
  var CFG = window.ISHUR_CONFIG;
  var $ = function (id) { return document.getElementById(id); };
  var REPO = 'https://github.com/richard36901-source/ishur.hagaha/blob/main-executer/';
  var KIND = { send_guest: ['אורחים', '--k-guest'], send_client: ['לקוח / ליד', '--k-client'], call: ['שיחה', '--k-call'], slack: ['סלאק', '--k-slack'], internal: ['פנימי', '--k-internal'], trigger: ['טריגר', '--k-trigger'] };
  var adminKey = '', DATA = null, FIXTURE = false, zoom = 1, listView = window.innerWidth < 640;

  /* theme: prefers-color-scheme by default; the button pins light/dark (same key as the dashboard) */
  $('themeTog').addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme') ||
      (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    var next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('ishur_theme', next); } catch (e) {}
  });

  /* auth — same pattern as admin.html: ?key= once, then localStorage ishur_calls_key */
  var qk = new URLSearchParams(location.search).get('key');
  if (qk) { try { localStorage.setItem('ishur_calls_key', qk); } catch (e) {} history.replaceState(null, '', location.pathname); }
  try { adminKey = localStorage.getItem('ishur_calls_key') || ''; } catch (e) { adminKey = qk || ''; }

  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) { if (k === 'text') e.textContent = attrs[k]; else if (k === 'cls') e.className = attrs[k]; else e.setAttribute(k, attrs[k]); }
    (kids || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function svg(tag, attrs) { var e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  function ilTime(iso) { if (!iso) return '—'; try { return new Date(iso).toLocaleString('he-IL', { timeZone: 'Asia/Jerusalem', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); } catch (e) { return iso; } }
  function heDay(iso) { var p = String(iso || '').split('-'); if (p.length !== 3) return iso || ''; var wd = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'שבת'][new Date(iso + 'T12:00:00Z').getUTCDay()]; return wd + ' ' + p[2] + '.' + p[1]; }
  function cssv(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#888'; }

  /* ── load ── */
  function load(fresh) {
    clear($('banner')); clear($('strip'));
    $('strip').appendChild(el('span', { cls: 'pill' }, [el('span', { cls: 'spin' }), 'טוען מצב חי… (סריקת יומן היום יכולה לקחת עד חצי דקה)']));
    fetch(CFG.endpoint('automations'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ admin_key: adminKey, fresh: !!fresh }) })
      .then(function (r) {
        if (r.status === 403) { try { localStorage.removeItem('ishur_calls_key'); } catch (e) {} gate('המפתח לא נכון'); return null; }
        if (r.status === 404) return fetch('automations.fixture.json?v=1').then(function (f) { if (!f.ok) throw new Error('fixture ' + f.status); FIXTURE = true; return f.json(); });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        FIXTURE = false; return r.json();
      })
      .then(function (d) { if (!d) return; DATA = d; render(); })
      .catch(function (e) { clear($('strip')); $('strip').appendChild(el('p', { cls: 'err', text: 'הטעינה נכשלה: ' + (e && e.message || e) })); });
  }

  function render() {
    renderBanner(); renderStrip(); renderLegend();
    if (listView) { $('mapbox').hidden = true; $('list').hidden = false; renderList(); } else { $('mapbox').hidden = false; $('list').hidden = true; renderMap(); }
    $('viewTog').textContent = listView ? 'מפה' : 'רשימה';
    renderTimeline();
  }
  function renderBanner() {
    var b = $('banner'); clear(b);
    if (FIXTURE || DATA.fixture) b.appendChild(el('div', { cls: 'banner' }, [el('b', { text: 'נתוני דמה (fixture) · ' }), (DATA.fixture_note || '') + ' הנתיב /api/automations עוד לא פרוס (404). כפתורי "החזק" כבויים.']));
  }
  function pill(label, val, cls) { return el('span', { cls: 'pill' + (cls ? ' ' + cls : '') }, [label + ' ', el('b', { text: String(val) })]); }
  function renderStrip() {
    var s = $('strip'); clear(s);
    var g = (DATA.live && DATA.live.global) || {};
    s.appendChild(pill('עודכן', ilTime(DATA.generated_at)));
    s.appendChild(pill('שליחה', g.paused ? 'מושהית ⏸' : 'פעילה', g.paused ? 'bad' : 'good'));
    s.appendChild(pill('חלון שליחה', g.send_window && g.send_window.open ? 'פתוח' : 'סגור'));
    s.appendChild(pill('חלון שיחות', g.call_window && g.call_window.open ? 'פתוח' : 'סגור'));
    if (g.wacap_guests) s.appendChild(pill('תקרה כללית', 'כל המספרים בתקרה', 'bad'));
    (g.numbers || []).forEach(function (n) { s.appendChild(pill(n.label, n.sent_today + ' היום' + (n.capped_since ? ' · בתקרה' : ''), n.capped_since ? 'bad' : '')); });
    s.appendChild(pill('אירועים מוחזקים', (g.holds || []).length, (g.holds || []).length ? 'bad' : ''));
    s.appendChild(pill('פייסר אחרון', ilTime(g.pacer_last_at)));
    s.appendChild(pill('מנוע אחרון', ilTime(g.engine_last && g.engine_last.at)));
    var warns = (DATA.registry.nodes || []).reduce(function (n, x) { return n + ((x.warnings || []).length ? 1 : 0); }, 0);
    s.appendChild(pill('צמתים עם ⚠', warns, warns ? 'bad' : ''));
  }
  function renderLegend() {
    var l = $('legend'); clear(l);
    Object.keys(KIND).forEach(function (k) { var i = el('i'); i.style.background = 'var(' + KIND[k][1] + ')'; l.appendChild(el('span', null, [i, KIND[k][0]])); });
    l.appendChild(el('span', { text: 'קו אדום מקווקו = כשל ממטא פותח מחדש' }));
  }

  /* ── layout: right-to-left flow. triggers at the right edge, then dispatchers, then bands of automations ── */
  var NW = 210, NH = 54, GX = 26, GY = 18, PER = 5;
  function layout(nodes) {
    var byId = {}; nodes.forEach(function (n) { byId[n.id] = n; });
    var order = ['d_engine', 'd_pacer', 't_cron10', 't_morning', 't_0400', 't_evening', 't_tue', 't_wa_status', ''];
    var title = { d_engine: 'המנוע היומי — לפי סדר השלבים בקוד', d_pacer: 'הפייסר — כל 10 דקות', t_cron10: 'משימות ישירות כל 10 דקות', t_morning: 'אחרי קרון הבוקר', t_0400: 'דופק 04:00 UTC', t_evening: 'ערב', t_tue: 'שלישי', t_wa_status: 'תגובה לוובהוק ממטא', '': 'ידני / מסוכן' };
    var bands = {}; order.forEach(function (k) { bands[k] = []; });
    nodes.forEach(function (n) { if (n.layer < 2) return; var p = (n.from || [])[0] || ''; (bands[p] || bands['']).push(n); });
    var W = 2 * (NW + 60) + PER * (NW + GX) + 80;
    var x0 = W - NW - 30, x1 = x0 - NW - 60, xs = x1 - NW - 60;
    var pos = {}, bandBoxes = [], y = 20;
    order.forEach(function (k) {
      var list = bands[k]; if (!list.length) return;
      var rows = Math.ceil(list.length / PER), h = rows * (NH + GY) + 30;
      bandBoxes.push({ y: y, h: h, title: title[k], key: k });
      list.forEach(function (n, i) { pos[n.id] = { x: xs - (i % PER) * (NW + GX), y: y + 26 + Math.floor(i / PER) * (NH + GY) }; });
      var mid = y + h / 2 - NH / 2;
      if (byId[k] && byId[k].layer === 1) pos[k] = { x: x1, y: mid };
      if (byId[k] && byId[k].layer === 0) pos[k] = { x: x0, y: mid };
      y += h + 14;
    });
    nodes.forEach(function (n) { if (pos[n.id]) return; pos[n.id] = n.layer === 0 ? { x: x0, y: (pos.d_pacer ? pos.d_pacer.y : 20) - 0 } : { x: x1, y: 20 }; });

  function renderMap() {

  }
  function trunc(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function renderList() {

      var lv = (DATA.live && DATA.live.nodes && DATA.live.nodes[n.id]) || {};
      var b = el('button', { cls: 'litem', type: 'button' }, [el('b', { text: ((n.warnings || []).length || n.mutating ? '⚠ ' : '') + n.name_he }), el('span', { text: (KIND[n.kind] || KIND.internal)[0] + (lv.today ? ' · היום ' + lv.today.sent + '✓ ' + (lv.today.failed || 0) + '✗' : '') + (lv.last_run && lv.last_run.at ? ' · רץ ' + ilTime(lv.last_run.at) : '') })]);

  /* ── side panel: every registry field + live state + source links ── */
  function src(a) { var f = a.file; return el('a', { href: REPO + f + '#L' + a.line, target: '_blank', rel: 'noopener' }, [el('code', { text: f.replace('worker/', '') + ':' + a.line })]); }
  function sect(body, title, content) { if (!content) return; body.appendChild(el('h4', { text: title })); body.appendChild(content); }
  function ul(arr) { if (!arr || !arr.length) return null; return el('ul', null, arr.map(function (x) { return el('li', null, [typeof x === 'string' ? x : x]); })); }
  function codes(arr) { if (!arr || !arr.length) return null; return el('p', null, arr.map(function (x) { return el('code', { text: x }); }).reduce(function (a, c) { a.push(c, ' '); return a; }, [])); }
  function showPanel(n) {

  $('pClose').addEventListener('click', function () { $('panel').classList.remove('open'); $('panel').setAttribute('aria-hidden', 'true'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') $('pClose').click(); });

  /* ── timeline per event per day ── */

    var h = $('tlHead'), bd = $('tlBody'); clear(h); clear(bd);

  function doHold(e, btn, items) {
    var blast = items.some(function (i) { return i.node === 'event_day_blast'; });
    var msg = 'להחזיק את כל השליחות לאורחים של "' + (e.name || e.tok8) + '"?\n\n' +
      'זה כותב hold:' + e.tok8 + '… ועוצר: גלים, דוח, תודה, שולחן, יום-לפני, ביטול/דחייה, וחיוג של שיר.\n' +
      (blast ? '\n⚠ הודעת יום האירוע (edblast) לא נעצרת ע"י החזקה — לעצור אותה צריך /api/event-day action:clear.\n' : '') +

      .then(function (r) { return r.json().then(function (j) { return { s: r.status, j: j }; }); })
      .then(function (x) {
        if (x.s === 200 && x.j && x.j.ok && x.j.on === true) { var sp = el('span', { cls: 'held', text: '⏸ הוחזק עכשיו' }); btn.replaceWith(sp); }
        else { btn.disabled = false; btn.textContent = 'החזק'; alert('ההחזקה לא נשמרה: ' + JSON.stringify(x.j)); }
      }).catch(function (err) { btn.disabled = false; btn.textContent = 'החזק'; alert('שגיאת רשת: ' + (err && err.message)); });
  }

  /* ── tabs / tools ── */
  function tab(which) { $('tabMap').setAttribute('aria-selected', which === 'map'); $('tabTl').setAttribute('aria-selected', which === 'tl'); $('secMap').hidden = which !== 'map'; $('secTl').hidden = which !== 'tl'; ['viewTog', 'zIn', 'zOut'].forEach(function (id) { $(id).hidden = which !== 'map'; }); try { localStorage.setItem('ishur_auto_tab', which); } catch (e) {} }
  $('tabMap').addEventListener('click', function () { tab('map'); });

  $('keyIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('keyGo').click(); });
  if (window.innerWidth < 640) zoom = 0.6;
