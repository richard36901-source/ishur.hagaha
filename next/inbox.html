  .gate p.err{color:var(--warn);font-size:.8rem;min-height:1.2rem;margin-top:.4rem}
  @media (max-width:640px){
    .list{width:100%;border:none}
    .pane{display:none}
    body.open .list{display:none}
    body.open .pane{display:flex}
    .backb{display:inline-block}
    .tab{padding:.32rem .42rem}
    .tab-t{font-size:.74rem}
    .tab-s{font-size:.56rem}
  }
  button:not(:disabled):active{transform:scale(.97)}
  @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
  .aisw{font-size:.72rem;font-weight:500;color:var(--ink2);margin-inline-start:.5rem;white-space:nowrap;cursor:pointer}
  .msg .lz{margin:0 0 .3rem}.msg .lzb{font:inherit;font-size:.82rem;font-weight:600;min-height:40px;padding:0 .9rem;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
  .msg .aud{display:block;width:250px;max-width:100%;height:40px;margin:.15rem 0 .3rem}.msg .vn{display:block;font-size:.72rem;color:var(--ink3)}
  .msg .q{display:block;border-inline-start:3px solid var(--gold,#A8853C);background:rgba(127,127,127,.12);border-radius:6px;padding:.25rem .45rem;margin:0 0 .3rem;font-size:.78rem;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .msg .card{display:block;border:1px solid var(--line);border-radius:8px;padding:.4rem .55rem;margin:0 0 .3rem;text-decoration:none;color:inherit;font-weight:600}.msg .card small{display:block;font-weight:400;font-size:.74rem;color:var(--ink3)}
  .msg.has-rx{margin-bottom:.85rem}.msg .rx{position:absolute;bottom:-.8rem;inset-inline-start:.5rem;background:var(--card);border:1px solid var(--line);border-radius:999px;font-size:.82rem;line-height:1;padding:.14rem .34rem}
  .msg .media{margin-top:.3rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}

</style>

<body>
<header class="head">
  <h1>ishur<i>.io</i> · אינבוקס</h1>
  <div class="head-btns">
    <button class="hbtn" id="themeTog" aria-label="מצב כהה / בהיר">🌙</button>
    <button class="hbtn" id="refresh">רענון</button>
    <a href="admin.html">→ מרכז הבקרה</a>
  </div>
</header>

<div class="gate" id="gate" hidden>
  <h2 style="font-family:'Frank Ruhl Libre',serif;color:var(--gold)">כניסת ניהול</h2>
  <input type="password" id="keyIn" placeholder="מפתח גישה" autocomplete="off">
  <button id="keyGo">כניסה</button>
  <p class="err" id="keyErr"></p>
</div>

<div class="split" id="split" hidden>
  <div class="list" id="listCol">
    <div class="tabs" role="tablist" aria-label="סינון לפי מספר">
      <button class="tab" role="tab" id="tabAll" data-ch="all" aria-selected="true" aria-controls="convList" tabindex="0">
        <span class="tab-t">הכל<span class="tab-n" id="cAll">·</span></span>
        <span class="tab-s he">כל השיחות</span>
      </button>
      <button class="tab" role="tab" id="tabClient" data-ch="client" aria-selected="false" aria-controls="convList" tabindex="-1">
        <span class="tab-t">נועה<span class="tab-n" id="cClient">·</span></span>
        <span class="tab-s he">מספר הלקוחות</span>
      </button>
      <button class="tab" role="tab" id="tabGuests" data-ch="guests" aria-selected="false" aria-controls="convList" tabindex="-1">
        <span class="tab-t">אורחים<span class="tab-n" id="cGuests">·</span></span>
        <span class="tab-s">055-972-6673</span>
      </button>
    </div>
    <div class="ownf" id="ownF" hidden role="group" aria-label="סינון לפי מטפלת"><button data-of="all" aria-pressed="true">כולם</button><button data-of="mine" aria-pressed="false" id="ofMine">שלי</button><button data-of="none" aria-pressed="false">לא משויך</button></div>
    <div class="csearch"><input type="search" id="convQ" placeholder="חיפוש: טלפון, שם או שם אירוע" aria-label="חיפוש שיחה" autocomplete="off" enterkeyhint="search"></div>
    <div id="convList" role="tabpanel" aria-labelledby="tabAll"></div>
  </div>
  <div class="pane">
    <div class="pane-h" hidden id="paneH">
      <button class="hbtn backb" id="backBtn" aria-label="חזרה לרשימת השיחות">→</button>
      <div class="pane-id">
        <div class="pane-name"><b id="pName" dir="auto"></b><span class="ch" id="pKind"></span><span class="nr" id="pNr" hidden>לא רלוונטי</span><select id="pOwn" class="ownsel" hidden aria-label="מי מטפלת בשיחה"></select> <label class="aisw" title="כשכבוי, נועה לא עונה בשיחה הזאת אף פעם. עדכוני מערכת ממשיכים לצאת"><input type="checkbox" id="aiSw"> נועה עונה כאן</label></div>
        <div class="pane-sub" id="pWa" hidden></div>
        <div class="pane-phone">
          <span class="p" id="pPhone"></span>
          <button class="copyb" id="copyPhone" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span id="copyLbl">העתקה</span>
          </button>
        </div>
        <div class="pane-since" id="pSince" hidden></div>
      </div>
    </div>
    <div class="thread" id="thread"><div class="empty">בוחרים שיחה מהרשימה ורואים כאן את כל ההיסטוריה</div></div>
    <div class="cbar" id="cbar" hidden aria-live="polite">
      <span>נשלח מ: <b id="cbLine">·</b></span>
      <span class="pill" id="cbWin"></span>
      <span class="pill quiet" id="cbQuiet" hidden></span>
    </div>
    <div class="att" id="att" hidden>
      <span id="attPv"></span>
      <div class="info"><b id="attName" dir="auto"></b><small id="attMeta"></small></div>
      <button type="button" class="x" id="attX">הסרה</button>
    </div>
    <div class="composer" id="composer" hidden>
      <button type="button" id="attBtn" title="צירוף קובץ" aria-label="צירוף קובץ: תמונה, סרטון, שמע או מסמך"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.4 11.1l-8.5 8.5a5.5 5.5 0 0 1-7.8-7.8l8.5-8.5a3.7 3.7 0 0 1 5.2 5.2l-8.5 8.5a1.8 1.8 0 0 1-2.6-2.6l7.8-7.8"/></svg></button>
      <input type="file" id="attIn" hidden accept="image/jpeg,image/png,image/webp,video/mp4,video/3gpp,audio/aac,audio/amr,audio/mpeg,audio/mp4,audio/ogg,.m4a,.mp3,.ogg,.aac,.amr,application/pdf,text/plain,.doc,.docx,.xls,.xlsx,.ppt,.pptx">
      <textarea id="txt" placeholder="כתבו תשובה…" aria-label="הודעה"></textarea>
      <button type="button" id="tmplBtn" title="שליחת תבנית מאושרת">תבנית</button>
      <button type="button" id="send">שליחה</button>
    </div>
  </div>
</div>

<div class="pop-bg" id="popBg"></div>
<div class="pop" id="pop" role="dialog" aria-modal="true" aria-labelledby="popH">
  <h3 id="popH">שליחת תבנית</h3>
  <p id="tmplWhy" hidden>עברו יותר מ-24 שעות מההודעה האחרונה שלהם, אז וואטסאפ מאפשרת רק תבנית מאושרת.</p>
  <label for="tmplSel">תבנית</label>
  <select id="tmplSel"><option value="">טוען תבניות…</option></select>
  <div class="tpv" id="tmplPv" hidden></div>
  <div id="tmplParams"></div>
  <div class="msgline" id="tmplMsg"></div>
  <div class="pop-btns">
    <button type="button" id="popCancel">ביטול</button>
    <button type="button" class="go" id="popSend">שליחה</button>
  </div>
</div>

<div class="pop" id="qpop" role="alertdialog" aria-modal="true" aria-labelledby="qH">
  <h3 id="qH">שעות שקט</h3>
  <p id="qTxt"></p>
  <div class="pop-btns">
    <button type="button" id="qNo">ביטול</button>
    <button type="button" class="go" id="qYes">שלח בכל זאת</button>
  </div>
</div>

<span class="sr" id="live" role="status" aria-live="polite"></span>

<script>
(function () {
  var CFG = window.ISHUR_CONFIG;
  var $ = function (id) { return document.getElementById(id); };
  var adminKey = '';
  var current = null;        /* phone of the open thread */
  var currentConv = null;    /* the conversation object behind it */
  var timer = null;
  var counts = { all: null, client: null, guests: null };

  /* ── theme ── */
  (function () {
    var b = $('themeTog');
    function paint() { b.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙'; }
    b.addEventListener('click', function () {
      var dark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (dark) document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', 'dark');
      try { localStorage.setItem('ishur_theme', dark ? 'light' : 'dark'); } catch (e) {}
      paint();
    });
    paint();
  })();

  /* ── the same admin key the control room uses ── */
  var qk = new URLSearchParams(location.search).get('key');
  if (qk) { try { localStorage.setItem('ishur_calls_key', qk); } catch (e) {} history.replaceState(null, '', location.pathname); }
  try { adminKey = localStorage.getItem('ishur_calls_key') || ''; } catch (e) { adminKey = ''; }

  function gate(msg) {
    $('gate').hidden = false; $('split').hidden = true;
    if (msg) $('keyErr').textContent = msg;
  }
  $('keyGo').addEventListener('click', function () {
    adminKey = $('keyIn').value.trim();
    if (!adminKey) return;
    try { localStorage.setItem('ishur_calls_key', adminKey); } catch (e) {}
    boot();
  });

  /* stale-while-revalidate: the last list and each thread are kept in
     sessionStorage, painted at once, and refreshed from the server behind */
  function cacheKey(payload) { return 'ishur_inbox:' + (payload.phone || 'list:' + (payload.channel || '')); }
  function cacheGet(payload) { try { var v = sessionStorage.getItem(cacheKey(payload)); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function cachePut(payload, d) { try { sessionStorage.setItem(cacheKey(payload), JSON.stringify(d)); } catch (e) {} }
  function api(payload, onFresh) {
    var cached = cacheGet(payload);
    var net = apiNet(payload).then(function (d) { if (d && d.ok) { cachePut(payload, d); if (cached && onFresh) onFresh(d); } return d; });
    if (cached && onFresh) return Promise.resolve(cached);
    return net;
  }
  function apiNet(payload) {
    payload.admin_key = adminKey;
    return fetch(CFG.endpoint('inbox'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function (r) {
      if (r.status === 403) { if (/^sess\./.test(adminKey) && (window.__k403 = (window.__k403 || 0) + 1) < 4) { setTimeout(function () { location.reload(); }, 2500); return null; } gate('המפתח לא נכון'); return null; }
      return r.status === 200 ? r.json() : null;
    }).catch(function () { return null; });
  }

  /* ── formatting helpers ── */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  /* 972545764327 → 054-576-4327. Anything we do not recognise stays +digits. */
  function fmtPhone(p) {
    var d = String(p == null ? '' : p).replace(/\D/g, '');
    if (!d) return '';
    if (d.indexOf('972') === 0 && d.length > 3) {
      var loc = '0' + d.slice(3);
      if (loc.length === 10) return loc.slice(0, 3) + '-' + loc.slice(3, 6) + '-' + loc.slice(6);
      if (loc.length === 9) return loc.slice(0, 2) + '-' + loc.slice(2, 5) + '-' + loc.slice(5);
      return loc;
    }
    return '+' + d;
  }

  /* name from the sheet, then the name the person gave WhatsApp, then nothing */
  function dispName(c) {
    if (!c) return 'לא מזוהה';
    return (c.name && String(c.name).trim()) || (c.wa_name && String(c.wa_name).trim()) || 'לא מזוהה';
  }

  function hhmm(d) { return d.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }); }

  /* compact stamp for the conversation list */
  function listTime(ts) {
    if (!ts) return '';
    var d = new Date(ts), n = new Date();
    if (d.toDateString() === n.toDateString()) return hhmm(d);
    var o = { day: 'numeric', month: 'numeric' };
    if (d.getFullYear() !== n.getFullYear()) o.year = '2-digit';
    return d.toLocaleDateString('he-IL', o);
  }
  /* stamp under a bubble — carries the year once the thread is old */
  function msgTime(ts) {
    if (!ts) return '';
    var d = new Date(ts), n = new Date();
    if (d.toDateString() === n.toDateString()) return hhmm(d);
    var o = { day: 'numeric', month: 'numeric' };
    if (d.getFullYear() !== n.getFullYear()) o.year = '2-digit';
    return d.toLocaleDateString('he-IL', o) + ' ' + hhmm(d);
  }
  function longDate(ts) {
    return new Date(ts).toLocaleDateString('he-IL', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  /* ── channel tabs ── */
  var CH_KEY = 'ishur_inbox_channel';
  var channel = 'all';
  try {
    var saved = localStorage.getItem(CH_KEY);
    if (saved === 'all' || saved === 'client' || saved === 'guests') channel = saved;
  } catch (e) {}

  var tabs = [$('tabAll'), $('tabClient'), $('tabGuests')];
  var countEl = { all: $('cAll'), client: $('cClient'), guests: $('cGuests') };

  function paintTabs() {
    tabs.forEach(function (t) {
      var on = t.getAttribute('data-ch') === channel;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
      if (on) $('convList').setAttribute('aria-labelledby', t.id);
    });
  }
  function paintCounts() {
    ['all', 'client', 'guests'].forEach(function (k) {
      countEl[k].textContent = counts[k] == null ? '·' : String(counts[k]);
    });
  }
  function setChannel(ch, moveFocus) {
    if (ch !== 'all' && ch !== 'client' && ch !== 'guests') return;
    channel = ch;
    try { localStorage.setItem(CH_KEY, ch); } catch (e) {}
    paintTabs();
    if (moveFocus) { tabs.forEach(function (t) { if (t.getAttribute('data-ch') === ch) t.focus(); }); }
    loadConvs();
  }
  tabs.forEach(function (t, i) {
    t.addEventListener('click', function () { setChannel(t.getAttribute('data-ch'), false); });
    t.addEventListener('keydown', function (e) {
      var j;
      if (e.key === 'ArrowLeft') j = i + 1;        /* RTL: left is "next" */
      else if (e.key === 'ArrowRight') j = i - 1;  /* RTL: right is "previous" */
      else if (e.key === 'Home') j = 0;
      else if (e.key === 'End') j = tabs.length - 1;
      else return;
      e.preventDefault();
      j = (j + tabs.length) % tabs.length;
      setChannel(tabs[j].getAttribute('data-ch'), true);
    });
  });
  paintTabs();
  paintCounts();

  /* ── conversation list ──
     counts come back computed over whatever the server just filtered, so the
     only response we trust for them is the unfiltered one. */
  /* 25/11 Richard: the same search as the main inbox - phone, name or event name, over every conversation (server side) */
  var convQuery = '', qTimer = null;
  $('convQ').addEventListener('input', function () {
    var v = this.value.trim();
    clearTimeout(qTimer);
    qTimer = setTimeout(function () { if (v !== convQuery) { convQuery = v; loadConvs(); } }, 280);
  });
  function loadConvs() {
    var want = channel;
    if (convQuery) {
      var wq = convQuery, pl = { q: wq }; if (want !== 'all') pl.channel = want;
      apiNet(pl).then(function (d) {
        if (!d || !d.ok || convQuery !== wq || channel !== want) return;
        paintList(d.conversations || []); shown();
      });
      return;
    }
    var onAll = function (d) {
      if (!d || !d.ok) return;
      if (d.counts) { counts = d.counts; paintCounts(); }
      if (channel === want) paintList(d.conversations || []);
      shown();
    };
    if (want === 'all') { api({}, onAll).then(onAll); return; }
    var onCh = function (d) {
      if (!d || !d.ok) return;
      if (channel === want) paintList(d.conversations || []);
      shown();
    };
    api({ channel: want }, onCh).then(onCh);
    api({}).then(function (d) {
      if (d && d.ok && d.counts) { counts = d.counts; paintCounts(); }
    });
  }
  function shown() { $('gate').hidden = true; $('split').hidden = false; }

  /* ── who handles a conversation (callers API). Nothing shows until at least one agent exists. ── */
  var OWN = { owners: {}, callers: [], me: null }, ownFilter = 'all', LAST_LIST = null;
  function ownApi(body) { body = body || {}; body.admin_key = adminKey; return fetch(CFG.endpoint('callers'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(function (r) { return r.status === 200 ? r.json() : null; }).then(function (d) { if (d && d.ok) { OWN = { owners: d.owners || {}, callers: d.callers || [], me: d.me || null }; $('ownF').hidden = !OWN.callers.length; $('ofMine').hidden = !OWN.me; if (LAST_LIST) paintList(LAST_LIST); } return d; }).catch(function () { return null; }); }
  function paintOwn(c) {
    var sel = $('pOwn'); if (!OWN.callers.length) { sel.hidden = true; return; }
    var ow = OWN.owners[c.phone]; sel.hidden = false;
    sel.innerHTML = '<option value="">מטפלת: אין</option>' + OWN.callers.map(function (x) { return '<option value="' + esc(x.phone) + '"' + (ow && ow.owner === x.phone ? ' selected' : '') + '>מטפלת: ' + esc(x.name) + '</option>'; }).join('');
  }
  /* the first agent who answers an unowned conversation becomes its owner */
  function claimIfMine() { if (OWN.me && current && !OWN.owners[current]) ownApi({ own: { phone: current, owner: 'me' } }); }
  function paintList(list) {
    var host = $('convList'); host.innerHTML = '';
    if (!list.length) {
      host.innerHTML = '<div class="empty">' +
        (convQuery ? 'לא נמצאה שיחה שמתאימה לחיפוש.' : channel === 'all'
          ? 'עוד אין שיחות. ברגע שמישהו יכתוב — זה יופיע כאן.'
          : 'אין שיחות במספר הזה.') + '</div>';
      return;
    }
    LAST_LIST = list;
    list.forEach(function (c) {
      if (c.phone === current) { currentConv = c; paintHeader(c); }
      var ow = OWN.owners[c.phone]; if ((ownFilter === 'mine' && !(ow && OWN.me && ow.owner === OWN.me.phone)) || (ownFilter === 'none' && ow)) return;
      var nm = dispName(c);
      var unknown = !(c.name && String(c.name).trim()) && !(c.wa_name && String(c.wa_name).trim());
      var b = document.createElement('button');
      b.className = 'conv' + (current === c.phone ? ' on' : '');
      b.innerHTML = '<b><span class="cname"><span dir="auto">' + esc(nm) + '</span>' +
        (unknown ? '<span class="cnum">' + esc(fmtPhone(c.phone)) + '</span>' : '') +
        (c.kind ? '<span class="ch">' + esc(c.kind) + '</span>' : '') +
        (c.nonrelevant ? '<span class="nr">לא רלוונטי</span>' : '') +
        (ow ? '<span class="own">' + esc(ow.name) + '</span>' : '') +
        '</span><time>' + esc(listTime(c.last_ts)) + '</time></b>' +
        (c.event ? '<span class="cev" dir="auto">' + esc(c.event) + '</span>' : '') +
        '<span class="prev">' + (c.last_dir === 'out' ? '↩ ' : '') + esc(c.last_text || '') + '</span>';
      b.addEventListener('click', function () { openConv(c); });
      host.appendChild(b);
    });
  }

  /* ── thread header ── */
  var WEEK = 7 * 24 * 60 * 60 * 1000;
  function paintHeader(c) {
    if (!c) return;
    paintOwn(c);
    $('pName').textContent = dispName(c);

    $('pKind').textContent = c.kind || '';
    $('pKind').hidden = !c.kind;
    $('pNr').hidden = !c.nonrelevant;

    var wa = (c.wa_name && String(c.wa_name).trim()) || '';
    var nm = (c.name && String(c.name).trim()) || '';
    var showWa = !!wa && wa !== nm;
    $('pWa').hidden = !showWa;
    $('pWa').innerHTML = showWa ? 'בוואטסאפ: <span dir="auto">' + esc(wa) + '</span>' : '';

    $('pPhone').textContent = fmtPhone(c.phone);
    var raw = String(c.phone || '').replace(/\D/g, '');
    var tip = 'מעתיק את המספר הבינלאומי המלא: ' + raw;
    $('copyPhone').title = tip;
    $('copyPhone').setAttribute('aria-label', tip);

    var old = c.first_ts && (Date.now() - c.first_ts > WEEK);
    $('pSince').hidden = !old;
    $('pSince').textContent = old ? 'שיחה מאז ' + longDate(c.first_ts) : '';
  }

  function openConv(c) {
    current = c.phone;
    currentConv = c;
    document.body.classList.add('open');
    $('paneH').hidden = false;
    $('composer').hidden = false;
    clearAtt(); $('txt').value = '';
    loadState();
    paintHeader(c);
    loadThread();

    sendVia(body).then(function (d) {
      if (d && d.ok) {
        pendingOut.push({ dir: 'out', type: m.type, text: m.text, tmpl: m.tmpl, params: m.params, media: m.media, buttons: m.buttons, footer: m.footer, ts: Date.now(), ok: true, status: 'sent', id: d.id || ('local-' + Date.now()), who: d.who, to: current, ch: d.channel });
        loadThread();
      } else { btn.disabled = false; btn.textContent = '↻ שלח שוב'; if (!d || d.error !== 'cancelled') toast(sendErr(d)); }
    });
  }
  var pendingOut = [];

  /* ── attach: preview first, upload to WhatsApp on send ── */
  var ATT = null;   /* {file, kind, url, err} */
  var KIND_HE = { image: 'תמונה', video: 'סרטון', audio: 'קובץ שמע', document: 'מסמך' };
  function fmtSize(n) { return n >= 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB'; }
  function localCheck(f) {
    /* the same rules the server holds (limits come from /api/inbox/state); the server checks again */
    var lim = ST && ST.limits && ST.limits.media; if (!lim) return { kind: 'document' };
    var t = String(f.type || '').toLowerCase().split(';')[0], ext = (String(f.name).toLowerCase().match(/\.([a-z0-9]+)$/) || [])[1] || '';
    var alias = { 'image/jpg': 'image/jpeg', 'audio/mp3': 'audio/mpeg', 'audio/x-m4a': 'audio/mp4', 'audio/m4a': 'audio/mp4' }; t = alias[t] || t;
    var byExt = { m4a: 'audio/mp4', mp3: 'audio/mpeg', ogg: 'audio/ogg', opus: 'audio/ogg', aac: 'audio/aac', amr: 'audio/amr', doc: 'application/msword', xls: 'application/vnd.ms-excel', ppt: 'application/vnd.ms-powerpoint', pdf: 'application/pdf', txt: 'text/plain' };
    if ((!t || t === 'application/octet-stream') && byExt[ext]) t = byExt[ext];
    var kind = ''; Object.keys(lim).forEach(function (k) { if (lim[k].mimes.indexOf(t) >= 0) kind = k; });
    if (!kind) return { err: t === 'audio/webm' ? 'הקלטה מהדפדפן (webm) לא נתמכת. שולחים mp3, m4a או ogg.' : t === 'video/quicktime' ? 'סרטון mov לא נתמך. צריך mp4.' : t === 'image/heic' ? 'HEIC לא נתמך. צריך jpg או png.' : 'סוג הקובץ לא נתמך בוואטסאפ.' };
    if (f.size > lim[kind].max) return { kind: kind, err: KIND_HE[kind] + ' עד ' + Math.round(lim[kind].max / 1048576) + 'MB.' };
    return { kind: kind };
  }
  function clearAtt() { if (ATT && ATT.url) URL.revokeObjectURL(ATT.url); ATT = null; $('att').hidden = true; $('attPv').innerHTML = ''; $('attIn').value = ''; if (ST) paintBar(); }
  function showAtt(f) {
    clearAtt();
    var c = localCheck(f), url = URL.createObjectURL(f);
    ATT = { file: f, kind: c.kind || '', url: url, err: c.err || '' };
    var pv = '';
    if (c.kind === 'image') pv = '<img class="pv" src="' + url + '" alt="תצוגה מקדימה">';
    else if (c.kind === 'video') pv = '<video class="pv" src="' + url + '" muted controls preload="metadata"></video>';
    else if (c.kind === 'audio') pv = '<audio class="pv" src="' + url + '" controls preload="metadata"></audio>';
    else pv = '<span class="doc">' + esc((String(f.name).match(/\.([a-z0-9]+)$/i) || ['', 'קובץ'])[1]) + '</span>';
    $('attPv').innerHTML = pv;
    $('attName').textContent = f.name;
    $('attMeta').innerHTML = c.err ? '<span class="err">' + esc(c.err) + '</span>' : esc((KIND_HE[c.kind] || 'קובץ') + ' · ' + fmtSize(f.size) + (c.kind === 'audio' ? ' · בלי כיתוב' : ''));
    $('att').hidden = false;
    paintBar();
    $('txt').focus();
  }
  $('attBtn').addEventListener('click', function () { if (!$('attBtn').disabled) $('attIn').click(); });
  $('attIn').addEventListener('change', function () { var f = this.files && this.files[0]; if (f) showAtt(f); });
  $('attX').addEventListener('click', clearAtt);
  /* a file dropped on the conversation or pasted into the box is attached the same way */
  $('thread').addEventListener('dragover', function (e) { if (current && winOpen()) e.preventDefault(); });
  $('thread').addEventListener('drop', function (e) { if (!current || !winOpen()) return; e.preventDefault(); var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (f) showAtt(f); });
  $('txt').addEventListener('paste', function (e) { var it = e.clipboardData && e.clipboardData.files && e.clipboardData.files[0]; if (it && winOpen()) { e.preventDefault(); showAtt(it); } });

  function uploadFile(f, to) {
    var fd = new FormData(); fd.append('phone', to); fd.append('file', f, f.name);
    return fetch(inboxApi('media'), { method: 'POST', headers: { 'x-admin-key': adminKey }, body: fd })
      .then(function (r) { if (r.status === 403) return { ok: false, error: 'auth' }; return r.json().catch(function () { return { ok: false, error: 'bad-response' }; }); })
      .catch(function () { return { ok: false, error: 'offline' }; });
  }

  function doSend() {
    if (!current || $('send').disabled) return;
    var t = $('txt').value.trim(), to = current;
    if (ATT && ATT.err) { toast(ATT.err); return; }
    if (!ATT && !t) return;
    $('send').disabled = true; $('send').textContent = ATT ? 'מעלה…' : 'שולח…';
    var done = function () { $('send').textContent = 'שליחה'; paintBar(); };
    if (!ATT) {
      sendVia({ kind: 'text', text: t }).then(function (d) {
        done();
        if (d && d.ok) { pendingOut.push({ dir: 'out', type: 'text', text: t, ts: Date.now(), ok: true, status: 'sent', id: d.id || ('local-' + Date.now()), who: d.who, to: to, ch: d.channel }); if (current === to) $('txt').value = ''; loadThread(); }
        else if (!d || d.error !== 'cancelled') toast(sendErr(d));
      });
      return;
    }
    var a = ATT;
    uploadFile(a.file, to).then(function (u) {
      if (!u || !u.ok) { done(); toast(u && u.he ? u.he : u && u.error === 'upload-failed' ? 'וואטסאפ לא קיבלה את הקובץ. נסו שוב או קובץ אחר.' : sendErr(u)); return; }
      $('send').textContent = 'שולח…';
      return sendVia({ kind: 'media', media: u.media, caption: a.kind === 'audio' ? '' : t }).then(function (d) {
        done();
        if (d && d.ok) {
          pendingOut.push({ dir: 'out', type: u.media.kind, text: a.kind === 'audio' ? '' : t, caption: t, media: { kind: u.media.kind, id: u.media.id, mime: u.media.mime, name: u.media.name }, ts: Date.now(), ok: true, status: 'sent', id: d.id || ('local-' + Date.now()), who: d.who, to: to, ch: d.channel });
          if (u.media.kind !== 'document') MEDIA[u.media.id] = a.url;   /* shown from the local copy, no download */
          ATT = null; $('att').hidden = true; $('attPv').innerHTML = ''; $('attIn').value = '';
          if (current === to) $('txt').value = '';
          loadThread();
        } else if (!d || d.error !== 'cancelled') toast(sendErr(d));
      });
    });
  }
  $('send').addEventListener('click', doSend);
  $('txt').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); doSend(); }
  });

  /* ── template picker: the approved templates of the line this conversation is on ── */
  var TPL = [], TPL_LINE = '', tplHeaderFile = null;
  var sel = $('tmplSel');
  function curTpl() { for (var i = 0; i < TPL.length; i++) if (TPL[i].name === sel.value) return TPL[i]; return null; }
  function paintPreview() {
    var t = curTpl(), pv = $('tmplPv');
    if (!t) { pv.hidden = true; return; }
    var vals = Array.prototype.map.call($('tmplParams').querySelectorAll('input[data-i]'), function (i) { return i.value.trim(); });
    pv.hidden = false;
    pv.innerHTML = (t.header && t.header.format === 'TEXT' && t.header.text ? '<b>' + esc(t.header.text) + '</b>\n' : '') +
      esc(t.body).replace(/\{\{(\d+)\}\}/g, function (_, n) { var v = vals[Number(n) - 1]; return v ? esc(v) : '<i>{{' + n + '}}</i>'; });
  }
  function paintParams() {
    var host = $('tmplParams'), t = curTpl(); host.innerHTML = ''; tplHeaderFile = null; $('tmplMsg').textContent = '';
    if (!t) { paintPreview(); return; }
    if (t.header && /^(IMAGE|VIDEO|DOCUMENT)$/.test(t.header.format)) {
      var hk = t.header.format.toLowerCase();
      host.insertAdjacentHTML('beforeend', '<label for="tplHdr">' + ({ image: 'תמונת כותרת', video: 'סרטון כותרת', document: 'מסמך כותרת' })[hk] + '</label>' +
        '<input type="file" id="tplHdr" accept="' + ({ image: 'image/jpeg,image/png', video: 'video/mp4', document: 'application/pdf' })[hk] + '">');
      $('tplHdr').addEventListener('change', function () { tplHeaderFile = this.files && this.files[0] || null; });
    }
    for (var i = 0; i < t.params; i++) {
      host.insertAdjacentHTML('beforeend', '<label for="tp' + i + '">משתנה {{' + (i + 1) + '}}</label><input id="tp' + i + '" data-i="' + i + '" autocomplete="off">');
    }
    if (t.button_param) {
      var b = t.buttons[t.button_param.index] || {};
      host.insertAdjacentHTML('beforeend', '<label for="tpBtn">סוף הקישור בכפתור "' + esc(b.text || '') + '"</label><input id="tpBtn" dir="ltr" autocomplete="off" placeholder="' + esc(String(b.url || '').replace('{{1}}', '…')) + '">');
    }
    host.querySelectorAll('input[data-i]').forEach(function (inp) { inp.addEventListener('input', paintPreview); });
    paintPreview();
  }
  sel.addEventListener('change', paintParams);
  function loadTemplates() {
    var want = current;
    sel.innerHTML = '<option value="">טוען תבניות…</option>'; sel.disabled = true; TPL = []; paintParams();
    postJson('templates', { phone: want }).then(function (d) {
      if (current !== want) return;
      sel.disabled = false;
      if (!d || !d.ok) { sel.innerHTML = '<option value="">לא הצלחנו לטעון תבניות</option>'; $('tmplMsg').textContent = d && d.error === 'guests-number-not-connected' ? 'מספר האורחים לא מחובר.' : 'נסו שוב בעוד רגע.'; return; }
      TPL = d.templates || []; TPL_LINE = d.channel;
      sel.innerHTML = '<option value="">בוחרים תבנית</option>' + TPL.map(function (t) {
        return '<option value="' + esc(t.name) + '"' + (t.supported ? '' : ' disabled') + '>' + esc(t.name) + (t.lang && t.lang !== 'he' ? ' · ' + esc(t.lang) : '') + (t.supported ? '' : ' (לא נתמך מכאן)') + '</option>';
      }).join('');
      paintParams();
    });
  }
  $('tmplBtn').addEventListener('click', function () {
    if (!current) return;
    $('tmplWhy').hidden = winOpen();
    $('popBg').classList.add('on'); $('pop').classList.add('on');
    loadTemplates(); sel.focus();
  });
  function closePop() { $('pop').classList.remove('on'); $('popBg').classList.remove('on'); }
  $('popCancel').addEventListener('click', closePop);
  $('popBg').addEventListener('click', function () { if ($('qpop').classList.contains('on')) closeQuiet(false); else closePop(); });
  document.addEventListener('keydown', function (e) { if (e.key !== 'Escape') return; if ($('qpop').classList.contains('on')) closeQuiet(false); else if ($('pop').classList.contains('on')) closePop(); });
  $('popSend').addEventListener('click', function () {
    var t = curTpl(), to = current;
    if (!t || !to) { $('tmplMsg').textContent = 'בוחרים תבנית.'; return; }
    var params = Array.prototype.map.call($('tmplParams').querySelectorAll('input[data-i]'), function (i) { return i.value.trim(); });
    if (params.some(function (p) { return !p; })) { $('tmplMsg').textContent = 'כל המשתנים נדרשים.'; return; }
    var needHdr = t.header && /^(IMAGE|VIDEO|DOCUMENT)$/.test(t.header.format);
    if (needHdr && !tplHeaderFile) { $('tmplMsg').textContent = 'התבנית צריכה קובץ בכותרת.'; return; }
    var btnTxt = t.button_param ? ($('tpBtn').value || '').trim() : '';
    if (t.button_param && !btnTxt) { $('tmplMsg').textContent = 'חסר סוף הקישור לכפתור.'; return; }
    $('popSend').disabled = true; $('tmplMsg').textContent = '';
    var go = function (hdr) {
      var tpl = { name: t.name, lang: t.lang, params: params };
      if (hdr) tpl.header_media = { id: hdr.id, kind: hdr.kind };
      if (btnTxt) tpl.button_param = { index: t.button_param.index, text: btnTxt };
      return sendVia({ kind: 'template', template: tpl }).then(function (d) {
        $('popSend').disabled = false;
        if (d && d.ok) {
          closePop();
          pendingOut.push({ dir: 'out', type: 'template', tmpl: t.name, params: params, lang: t.lang, text: t.body.replace(/\{\{(\d+)\}\}/g, function (_, n) { return params[Number(n) - 1] || ''; }), ts: Date.now(), ok: true, status: 'sent', id: d.id || ('local-' + Date.now()), who: d.who, to: to, ch: d.channel });
          loadThread();
        } else if (!d || d.error !== 'cancelled') $('tmplMsg').textContent = sendErr(d);
      });
    };
    if (!needHdr) { go(null); return; }
    uploadFile(tplHeaderFile, to).then(function (u) {
      if (!u || !u.ok) { $('popSend').disabled = false; $('tmplMsg').textContent = u && u.he ? u.he : 'הקובץ לא עלה לוואטסאפ.'; return; }
      go({ id: u.media.id, kind: u.media.kind });
    });
  });

  /* ── refresh loop ── */
  $('refresh').addEventListener('click', function () { loadConvs(); loadThread(); loadState(); });
  $('ownF').addEventListener('click', function (e) { var b = e.target.closest('button[data-of]'); if (!b) return; ownFilter = b.dataset.of; [].forEach.call($('ownF').querySelectorAll('button'), function (x) { x.setAttribute('aria-pressed', String(x === b)); }); if (LAST_LIST) paintList(LAST_LIST); });
  $('pOwn').addEventListener('change', function () { if (current) ownApi({ own: { phone: current, owner: $('pOwn').value } }); });
  function boot() {
    if (!adminKey) { gate(); return; }
    ownApi({}); setInterval(function () { if (!document.hidden) ownApi({}); }, 60000);
    /* 16/11: the screen is there at once; rows shimmer until the list arrives */
    shown(); var cl = $('convList'); if (cl && !cl.children.length) cl.innerHTML = Array(9).join('<div style="padding:.85rem 1rem;border-bottom:1px solid var(--line)" aria-hidden="true"><span class="sk" style="height:.9rem;width:42%;margin-bottom:.5rem"></span><span class="sk" style="height:.75rem;width:78%"></span></div>');
    loadConvs();
    clearInterval(timer);
    var tick = 0;
    timer = setInterval(function () { tick++; loadThread(); if (tick % 3 === 0) loadConvs(); }, 10000);
  }
  boot();
})();
</script>
</body>
</html>
