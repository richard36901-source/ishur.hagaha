<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>סידור הושבה · אישורי הגעה</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<script src="config.js?v=74"></script>
<script src="assets/i18n.js?v=8" defer></script>
<script src="assets/ux.js?v=9"></script>
<script src="assets/guard.js?v=22"></script>
<style>
  :root{--green:#0F4C35;--green2:#0A3826;--green4:#F3F8F5;--gold:#A8853C;--ink:#111827;--ink2:#374151;--ink3:#6b7280;--bdr:#e5e7eb;--bdr2:rgba(15,76,53,.2);--bg2:#f9fafb;--card:#fff;--warn:#A8402F;--ease:cubic-bezier(.22,.9,.24,1)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{display:flex;flex-direction:column;font-family:'Heebo',sans-serif;background:var(--bg2);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;touch-action:none}
  .top{display:flex;align-items:center;gap:.8rem;padding:.6rem 1rem;background:var(--card);border-bottom:1px solid var(--bdr);min-height:56px;flex:none;flex-wrap:wrap;row-gap:.4rem}
  .top{padding-left:5.6rem}   /* the language button sits in this corner */
  .top .btn{white-space:nowrap}
  /* 21/11: on a phone the bar wraps instead of pushing "save" off screen (it did in Hebrew too) */
  @media (max-width:640px){.top{height:auto;min-height:56px;flex-wrap:wrap;row-gap:.4rem}}
  .top h1{font-family:'Rubik',sans-serif;font-size:1.05rem;font-weight:600}
  .top .sub{font-size:.78rem;color:var(--ink3)}
  .top .sp{flex:1}
  .btn{font:inherit;font-size:.84rem;font-weight:600;padding:.45rem .95rem;border-radius:999px;border:1.5px solid var(--bdr);background:var(--card);color:var(--ink);cursor:pointer;transition:transform .12s,background .15s}
  .btn:active{transform:scale(.97)}
  .btn.p{background:var(--green);color:#fff;border-color:transparent}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.p.ok:disabled{opacity:1;background:var(--green4);color:var(--green2);border:1.5px solid var(--bdr2)}
  .btn.p.saving{background:var(--gold);opacity:1}
  .btn.p.dirty{background:var(--green)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}.btn.p.saving{animation:pulse 1s infinite}
  .lay{display:grid;grid-template-columns:300px 1fr;flex:1;min-height:0}
  @media (max-width:760px){.lay{grid-template-columns:1fr;grid-template-rows:auto 1fr}.side{max-height:38vh}}
  /* sidebar: the guest list, drag from here onto a table */
  .side{background:var(--card);border-inline-end:1px solid var(--bdr);display:flex;flex-direction:column;min-height:0}
  .side .hd{padding:.7rem .9rem .4rem;border-bottom:1px solid var(--bdr)}
  .side .hd input{width:100%;font:inherit;font-size:.86rem;padding:.45rem .7rem;border:1.5px solid var(--bdr);border-radius:10px;background:var(--bg2)}
  .side .hd input:focus{outline:none;border-color:var(--green)}
  .side .cnt{font-size:.74rem;color:var(--ink3);margin-top:.35rem}
  .list{overflow:auto;padding:.4rem;flex:1;overscroll-behavior:contain}
  .g{display:flex;align-items:center;gap:.55rem;padding:.5rem .6rem;border-radius:10px;cursor:grab;user-select:none;border:1px solid transparent;transition:background .12s}
  .g:hover{background:var(--bg2)}
  .g.dragging{opacity:.35}
  .g.seated{opacity:.5}
  .g .av{width:30px;height:30px;border-radius:50%;background:var(--green4);color:var(--green2);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;flex-shrink:0}
  .g .nm{font-size:.88rem;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .g .pp{font-size:.74rem;color:var(--ink3);white-space:nowrap}
  .g .at{font-size:.7rem;color:var(--green);background:var(--green4);padding:.05rem .4rem;border-radius:6px}
  /* the floor */
  .floor{position:relative;overflow:hidden;background:
    linear-gradient(var(--bdr) 1px,transparent 1px) 0 0/24px 24px,
    linear-gradient(90deg,var(--bdr) 1px,transparent 1px) 0 0/24px 24px, #FBFAF7}
  .floor.over{background-color:#f3f8f5}
  .tbl{position:absolute;background:var(--card);border:2px solid var(--bdr);border-radius:50%;box-shadow:0 4px 14px rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:grab;user-select:none;transition:box-shadow .15s,border-color .15s;touch-action:none}
  .tbl.rect{border-radius:16px}
  .tbl.drag{box-shadow:0 14px 34px rgba(0,0,0,.18);z-index:5}
  .tbl.hot{border-color:var(--green);box-shadow:0 0 0 6px rgba(15,76,53,.14),0 8px 24px rgba(0,0,0,.12)}
  .tbl.full{border-color:var(--warn)}
  .tbl .tn{font-family:'Rubik',sans-serif;font-weight:600;font-size:.95rem;pointer-events:none}
  .tbl .tc{font-size:.74rem;color:var(--ink3);pointer-events:none;font-variant-numeric:tabular-nums;direction:ltr}
  .tbl .tc b{color:var(--ink)}
  .tbl.full .tc b{color:var(--warn)}
  /* the chairs around the table: one dot per seat, filled when taken */
  .tbl .seat{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--bdr);pointer-events:none;transition:background .15s,transform .15s}
  .tbl .seat.on{background:var(--green);transform:scale(1.15)}
  .tbl .rz{position:absolute;right:-7px;bottom:-7px;width:18px;height:18px;border-radius:50%;background:var(--card);border:2px solid var(--gold);cursor:nwse-resize;touch-action:none}
  .tbl .rz::after{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--gold)}
  .tbl .x{position:absolute;top:-8px;left:-8px;width:20px;height:20px;border-radius:50%;background:var(--card);border:1.5px solid var(--bdr);font-size:.8rem;line-height:1;display:none;align-items:center;justify-content:center;cursor:pointer;color:var(--ink3)}
  .tbl:hover .x{display:flex}
  .tbl.sel{border-color:var(--gold)}
  /* who sits at the selected table */
  .pop{position:absolute;z-index:8;background:var(--card);border:1.5px solid var(--gold);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.14);padding:.6rem .7rem;min-width:190px;max-width:240px;font-size:.84rem}
  .pop .ph{font-weight:600;margin-bottom:.3rem;display:flex;justify-content:space-between;align-items:center;gap:.4rem}
  .pop .ph input{font:inherit;font-weight:600;width:6.5rem;border:none;border-bottom:1px dashed var(--bdr);background:transparent}
  .pop .ph input:focus{outline:none;border-color:var(--green)}
  .pop .pr{display:flex;justify-content:space-between;align-items:center;padding:.2rem 0;border-bottom:1px solid var(--bdr)}
  .pop .pr:last-of-type{border-bottom:none}
  .pop .pr small{color:var(--ink3)}
  .pop .pr button{font:inherit;font-size:.72rem;border:none;background:none;color:var(--warn);cursor:pointer}
  .pop .cap{display:flex;align-items:center;gap:.35rem;font-size:.76rem;color:var(--ink2);margin-top:.4rem}
  .pop .cap input{width:3.2rem;font:inherit;padding:.15rem .3rem;border:1px solid var(--bdr);border-radius:6px}
  /* 22/11 the hall itself: chuppah, bar, stage, kitchen… any shape, any name, any of eight colours. They sit under the tables and take no guests. */
  .tbl{z-index:2}
  .obj{position:absolute;z-index:1;display:flex;align-items:center;justify-content:center;cursor:grab;user-select:none;touch-action:none;--oc:#A8853C;--ob:#F6EEDC;--ot:#5C4513}
  .obj .sh{position:absolute;inset:0;background:var(--ob);border:2px solid var(--oc);border-radius:8px;pointer-events:none}
  .obj.round .sh{border-radius:50%}
  .obj.arch .sh{border-radius:50% 50% 8px 8px / 70% 70% 8px 8px}
  .obj.diamond .sh,.obj.hex .sh,.obj.oct .sh{border:0;background:var(--oc)}
  .obj.oct .sh{clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
  .obj.diamond .sh{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
  .obj.hex .sh{clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
  .obj.diamond .sh::after,.obj.hex .sh::after,.obj.oct .sh::after{content:'';position:absolute;inset:2px;background:var(--ob);clip-path:inherit}
  .obj .on{position:relative;font-family:'Rubik',sans-serif;font-weight:600;font-size:.84rem;line-height:1.2;color:var(--ot);text-align:center;padding:.15rem .4rem;max-width:100%;overflow:hidden;overflow-wrap:anywhere;pointer-events:none}
  .obj.drag{z-index:5;filter:drop-shadow(0 10px 18px rgba(0,0,0,.18))}
  .obj.sel .sh{box-shadow:0 0 0 3px rgba(168,133,60,.35)}
  .obj .orz{position:absolute;right:-7px;bottom:-7px;width:18px;height:18px;border-radius:50%;background:var(--card);border:2px solid var(--gold);cursor:nwse-resize;touch-action:none;display:none}
  .obj .orz::after{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--gold)}
  .obj.sel .orz,.obj:hover .orz{display:block}
  .pop .row{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.45rem;align-items:center}
  .pop .row small{flex-basis:100%;color:var(--ink3);font-size:.72rem}
  .pop .shp{font:inherit;font-size:.74rem;padding:.2rem .5rem;border:1.5px solid var(--bdr);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
  .pop .shp.on{border-color:var(--green);background:var(--green4);color:var(--green2)}
  .pop .sw{width:26px;height:26px;border-radius:8px;border:2px solid transparent;cursor:pointer;padding:0}
  .pop .sw.on{outline:2px solid var(--ink);outline-offset:1px}
  .pop .own{display:inline-flex;align-items:center;gap:.35rem;font-size:.74rem;color:var(--ink2);margin:0;flex-basis:100%}
  .pop .own input{width:30px;height:26px;padding:0;border:1.5px solid var(--bdr);border-radius:8px;background:none;cursor:pointer}
  .pop .own.on input{outline:2px solid var(--ink);outline-offset:1px}
  .pop .del{font:inherit;font-size:.76rem;border:none;background:none;color:var(--warn);cursor:pointer;margin-top:.5rem;padding:.2rem 0}
  .pop input.onm{font:inherit;font-weight:600;width:100%;border:none;border-bottom:1px dashed var(--bdr);background:transparent;color:var(--ink);padding:.1rem 0}
  .pop input.onm:focus{outline:none;border-color:var(--green)}
  /* 22/11 Richard: hide the guest list to lay the hall out first; a turned phone gets the floor; first-time steps */
  .lay.noside{grid-template-columns:1fr;grid-template-rows:1fr}
  .lay.noside .side{display:none}
  @media (orientation:landscape) and (max-height:520px){
    .top{height:44px;min-height:44px;flex-wrap:nowrap;overflow-x:auto;padding:.3rem .6rem;gap:.4rem;scrollbar-width:none}
    .top::-webkit-scrollbar{display:none}
    .top .btn{white-space:nowrap;padding:.3rem .7rem;font-size:.78rem;flex:none}
    .top h1{font-size:.92rem;white-space:nowrap}.top .sub{display:none}
    .lay{grid-template-columns:210px 1fr;grid-template-rows:1fr}
    .lay.noside{grid-template-columns:1fr}
    .side{max-height:none}
    .hint{display:none}
    .fab{bottom:.4rem}
  }
  .seatdlg .cur{font-size:.82rem;color:var(--ink2);margin:.2rem 0 .5rem}
  .seatdlg .tin{display:flex;gap:.4rem;margin:.5rem 0}
  .seatdlg .tin input{flex:1;min-width:0;font:inherit;font-size:1rem;padding:.5rem .65rem;border:1.5px solid var(--bdr);border-radius:8px;background:var(--card);color:var(--ink)}
  .seatdlg .tin input:focus{outline:none;border-color:var(--green)}
  .seatdlg .chips{display:flex;flex-wrap:wrap;gap:.3rem;max-height:9.5rem;overflow:auto}
  .seatdlg .chip{font:inherit;font-size:.78rem;padding:.25rem .6rem;border:1.5px solid var(--bdr);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
  .seatdlg .chip.full{opacity:.45}
  .seatdlg .chip.on{border-color:var(--green);background:var(--green4);color:var(--green2)}
  .seatdlg .chip small{color:var(--ink3)}
  .seatdlg .msg{min-height:1.2em;font-size:.8rem;color:var(--warn);margin-top:.35rem}
  .seatdlg .acts{display:flex;gap:.5rem;margin-top:.6rem;flex-wrap:wrap}
  .seatdlg .lnk{font:inherit;font-size:.8rem;border:none;background:none;color:var(--warn);cursor:pointer;padding:.3rem 0}
  .guide{position:fixed;z-index:90;inset-inline:0;bottom:0;display:flex;justify-content:center;padding:.8rem;pointer-events:none}
  .guide .gc{pointer-events:auto;background:var(--card);border:1.5px solid var(--bdr2);border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.16);padding:.8rem .9rem;width:100%;max-width:420px}
  .guide .gs{font-size:.72rem;color:var(--ink3)}
  .guide h4{font-family:'Rubik',sans-serif;font-size:.98rem;font-weight:600;margin:.1rem 0 .25rem}
  .guide p{font-size:.86rem;color:var(--ink2)}
  .guide .ga{display:flex;gap:.5rem;margin-top:.6rem;align-items:center}
  .guide .ga .sp{flex:1}
  .fab{position:absolute;bottom:1rem;inset-inline-start:1rem;display:flex;gap:.5rem;z-index:6}
  /* groups: a folder per label, draggable onto a table (Richard 21/10) */
  .grps{display:flex;gap:.35rem;flex-wrap:wrap;padding:.45rem .6rem .2rem}
  .grp{display:inline-flex;align-items:center;gap:.35rem;border:1.5px solid var(--bdr);border-radius:999px;padding:.2rem .65rem;font-size:.76rem;font-weight:600;cursor:grab;user-select:none;background:var(--card)}
  .grp b{font-weight:500;color:var(--ink3)}
  .grp.on{background:var(--green);color:#fff;border-color:transparent}
  .grp.on b{color:rgba(255,255,255,.8)}
  .grp.dragging{opacity:.4}
  .grp.add{border-style:dashed;color:var(--ink3);cursor:pointer}
  .g .gt{font-size:.66rem;border-radius:5px;padding:0 .3rem;background:var(--bg2);color:var(--ink2);white-space:nowrap;cursor:pointer}
  .g .gt.none{opacity:.55}
  .tplw{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:95;padding:1rem}
  .tpl{background:var(--card);border-radius:16px;padding:1.1rem;width:100%;max-width:460px}
  .tpl h3{margin:0 0 .3rem}
  .tpl .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:.7rem 0}
  .tpl .opt{border:1.5px solid var(--bdr);border-radius:12px;padding:.6rem .4rem;text-align:center;cursor:pointer;font-size:.8rem}
  .tpl .opt.on{border-color:var(--green);background:var(--green4)}
  .tpl .opt svg{display:block;margin:0 auto .3rem}
  .tpl label{display:block;font-size:.8rem;margin:.4rem 0 .2rem}
  .tpl input[type=number]{font:inherit;width:5rem;padding:.4rem;border:1.5px solid var(--bdr);border-radius:8px}
  .hint{position:absolute;top:.7rem;inset-inline-start:1rem;font-size:.76rem;color:var(--ink3);background:rgba(255,255,255,.85);padding:.25rem .6rem;border-radius:8px;pointer-events:none}
  .ghost{position:fixed;z-index:50;pointer-events:none;background:var(--green);color:#fff;font-size:.82rem;font-weight:600;padding:.35rem .7rem;border-radius:999px;box-shadow:0 8px 20px rgba(0,0,0,.2);transform:translate(-50%,-50%)}
  .toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:.6rem 1rem;border-radius:12px;font-size:.85rem;opacity:0;transition:.2s;z-index:99}
  .toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<header class="top">
  <a id="back" href="#" class="btn" style="padding:.35rem .7rem">→ ללוח</a><div><h1>סידור הושבה</h1><div class="sub" id="sub">טוען…</div></div>
  <span class="sp"></span>
  <button class="btn" id="sideBtn">הסתרת רשימת האורחים</button>
  <button class="btn" id="tplBtn">תבניות</button>
  <button class="btn" id="addRound">+ שולחן עגול</button>
  <button class="btn" id="addRect">+ שולחן ארוך</button>
  <button class="btn" id="addObj">+ חופה, בר, במה</button>
  <button class="btn p ok" id="save" disabled>נשמר ✓</button>
</header>
<div class="lay" id="lay">
  <aside class="side">
    <div class="hd">
      <input type="search" id="q" placeholder="חיפוש אורח">
      <div class="cnt" id="cnt"></div>
      <div style="display:flex;gap:.3rem;margin-top:.4rem" id="flt"><button class="btn" data-f="all" style="padding:.15rem .6rem;font-size:.72rem;background:var(--green);color:#fff;border-color:transparent">הכל</button><button class="btn" data-f="confirmed" style="padding:.15rem .6rem;font-size:.72rem">אישרו</button><button class="btn" data-f="pending" style="padding:.15rem .6rem;font-size:.72rem">לא ענו</button></div>
    </div>
    <div class="grps" id="grps"></div>
    <div class="list" id="list">
      <div class="g"><span class="av ux-skel">&nbsp;&nbsp;</span><span class="nm ux-skel">&nbsp;</span><span class="pp ux-skel">&nbsp;&nbsp;&nbsp;&nbsp;</span></div>
      <div class="g"><span class="av ux-skel">&nbsp;&nbsp;</span><span class="nm ux-skel">&nbsp;</span><span class="pp ux-skel">&nbsp;&nbsp;&nbsp;&nbsp;</span></div>
      <div class="g"><span class="av ux-skel">&nbsp;&nbsp;</span><span class="nm ux-skel">&nbsp;</span><span class="pp ux-skel">&nbsp;&nbsp;&nbsp;&nbsp;</span></div>
      <div class="g"><span class="av ux-skel">&nbsp;&nbsp;</span><span class="nm ux-skel">&nbsp;</span><span class="pp ux-skel">&nbsp;&nbsp;&nbsp;&nbsp;</span></div>
      <div class="g"><span class="av ux-skel">&nbsp;&nbsp;</span><span class="nm ux-skel">&nbsp;</span><span class="pp ux-skel">&nbsp;&nbsp;&nbsp;&nbsp;</span></div>
      <div class="g"><span class="av ux-skel">&nbsp;&nbsp;</span><span class="nm ux-skel">&nbsp;</span><span class="pp ux-skel">&nbsp;&nbsp;&nbsp;&nbsp;</span></div>
    </div>
  </aside>
  <div class="floor" id="floor">
    <div class="hint">גררו אורח מהרשימה אל שולחן · גררו שולחן להזזה · הנקודה הזהובה מגדילה ומוסיפה מקומות</div>
    <div id="floorLoad" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:.9rem;gap:.5rem"><span class="ux-skel" style="display:inline-block;width:120px;height:120px;border-radius:50%"></span><span class="ux-skel" style="display:inline-block;width:120px;height:120px;border-radius:50%"></span></div>
    <div class="fab"><button class="btn" id="auto">שיבוץ אוטומטי למי שנשאר</button><button class="btn" id="clear">ניקוי</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var CFG = window.ISHUR_CONFIG;
  var token = new URLSearchParams(location.search).get('t') || '';
  var guests = [];   /* {id, name, party, status, table} from /api/status */
  var flt = 'all';
  var STL = { confirmed: 'אישרו', pending: 'לא ענו', awaiting_call: 'לא ענו', declined: 'סירבו' };
  var tables = [];   /* {id, name, x, y, w, h, shape, cap} */
  var groups = {};   /* guest id → label (משפחה, חברים, עבודה…) */
  var DEFAULT_GROUPS = ['משפחה', 'חברים', 'עבודה', 'שכנים'];
  var grpFilter = '';
  var items = [];    /* 22/11 the hall: {id, kind, label, shape, color, x, y, w, h}: chuppah, bar, stage… kept with the table map */
  var selObj = null;
  var KINDS = [
    { k: 'chuppah',  label: 'חופה',          shape: 'rect',  color: 'gold',   w: 120, h: 120 },
    { k: 'bar',      label: 'בר',            shape: 'rect',  color: 'blue',   w: 200, h: 60 },
    { k: 'stage',    label: 'במה',           shape: 'arch',  color: 'purple', w: 240, h: 100 },
    { k: 'dance',    label: 'רחבת ריקודים',  shape: 'rect',  color: 'gray',   w: 220, h: 200 },
    { k: 'kitchen',  label: 'מטבח',          shape: 'rect',  color: 'gray',   w: 170, h: 80 },
    { k: 'entrance', label: 'כניסה לאולם',   shape: 'rect',  color: 'green',  w: 130, h: 44 },
    { k: 'dj',       label: 'עמדת די־ג׳יי',  shape: 'round', color: 'dark',   w: 90,  h: 90 },
    { k: 'buffet',   label: 'מזנון',         shape: 'rect',  color: 'red',    w: 220, h: 60 },
    { k: 'photo',    label: 'עמדת צילום',    shape: 'oct',   color: 'pink',   w: 100, h: 100 },
    { k: 'gifts',    label: 'שולחן מתנות',   shape: 'rect',  color: 'gold',   w: 130, h: 60 },
