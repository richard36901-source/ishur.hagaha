<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>תודה שהייתם איתנו · ishur.io</title>
<link rel="icon" type="image/png" sizes="128x128" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js?v=72"></script>
<script src="assets/tracking.js?v=23"></script>
<style>
  /* 08/11 (Richard): the page behind the UTILITY thank-you button (ishur_toda_orach_u).
     The "want this for your event" line lives HERE, not in the WhatsApp body,
     so the message itself stays transactional. */
  :root{--green:#0F4C35;--green2:#0A3826;--green4:#F3F8F5;--ink:#111827;--ink2:#374151;--ink3:#6b7280;--bdr:#e5e7eb;--bg2:#f9fafb}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Heebo',sans-serif;background:var(--bg2);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;line-height:1.65;-webkit-font-smoothing:antialiased}
  .card{width:100%;max-width:460px;background:#fff;border:1px solid var(--bdr);border-radius:18px;padding:2rem 1.6rem;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.06),0 16px 48px rgba(0,0,0,.06)}
  .heart{font-size:2.2rem;line-height:1}
  h1{font-size:1.5rem;margin:.6rem 0 .4rem;letter-spacing:-.01em}
  p{color:var(--ink2);font-size:1rem}
  .sep{height:1px;background:var(--bdr);margin:1.6rem 0}
  .promo{background:var(--green4);border-radius:14px;padding:1.2rem}
  .promo h2{font-size:1.1rem;color:var(--green);margin-bottom:.3rem}
  .cta{display:inline-block;margin-top:1rem;background:var(--green);color:#fff;text-decoration:none;font-weight:600;padding:.8rem 1.5rem;border-radius:999px;white-space:nowrap}
  .cta:active{transform:scale(.98)}
  footer{margin-top:1.4rem;font-size:.8rem;color:var(--ink3)}
</style>
</head>
<body>
  <main class="card">
    <div class="heart" aria-hidden="true">🤍</div>
    <h1>תודה שהייתם איתנו</h1>
    <p>השמחה הייתה גדולה יותר בזכותכם. מאחלים המון אושר לבעלי השמחה, ושניפגש רק באירועים טובים.</p>
    <div class="sep"></div>
    <section class="promo">
      <h2>יש לכם אירוע בקרוב?</h2>
      <p>אישורי ההגעה שקיבלתם בוואטסאפ יכולים להיות גם שלכם: הזמנה, תזכורות, שיחות ודף מעקב בזמן אמת.</p>
      <a class="cta" href="https://ishur.io/?utm_source=whatsapp&utm_medium=toda_u&utm_campaign=guest_thanks">רוצים כזה לאירוע שלנו</a>
    </section>
    <footer>ishur.io · אישורי הגעה בוואטסאפ</footer>
  </main>
</body>
</html>
