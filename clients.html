<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>לקוחות · ishur.io</title>
<link rel="icon" type="image/png" sizes="128x128" href="assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js?v=70"></script>
<script src="assets/ux.js?v=4"></script>
<script src="assets/adminbar.js?v=13" defer></script>
<script src="assets/guard.js?v=19"></script>
<style>
  :root{--ink:#1B2620;--ink2:#4E5C55;--ink3:#7F8C86;--paper:#FBFAF7;--card:#fff;--line:#E1E4DE;--pine:#0F4C35;--gold:#B4884A;--warn:#A8402F;--good:#2E7D5B;--rail:#F0EFE9}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Heebo',sans-serif;font-size:15px;line-height:1.5}
  .wrap{max-width:1100px;margin:0 auto;padding:1.4rem 1rem 4rem}
  h1{font-family:'Frank Ruhl Libre',serif;color:var(--pine);font-size:1.6rem;margin:0 0 .2rem}
  .sub{color:var(--ink3);font-size:.82rem;margin:0 0 1rem}
  .bar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.8rem}
  select,input[type=search]{font:inherit;padding:.45rem .7rem;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.9rem 1rem;margin-bottom:.7rem}
  .card.inactive{opacity:.55}
  .top{display:flex;justify-content:space-between;gap:.8rem;flex-wrap:wrap;align-items:baseline}
  .name{font-weight:700;font-size:1.05rem}
  .meta{color:var(--ink2);font-size:.84rem}
  .tags{display:flex;gap:.35rem;flex-wrap:wrap;margin:.45rem 0}
  .tag{font-size:.72rem;padding:.1rem .5rem;border-radius:6px;background:var(--rail);color:var(--ink2)}
  .tag.on{background:rgba(46,125,91,.13);color:var(--good)}
  .tag.warn{background:rgba(168,64,47,.12);color:var(--warn)}
  .acts{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem}
  .btn{font:inherit;font-size:.82rem;padding:.4rem .75rem;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none}
  .btn.p{background:var(--pine);color:#fff;border-color:var(--pine)}
  .btn.g{border-color:var(--gold);color:var(--gold)}
  .gate{max-width:340px;margin:4rem auto;text-align:center}
  .gate input{width:100%;padding:.7rem;font:inherit;border:1px solid var(--line);border-radius:10px;text-align:center;direction:ltr;margin:.6rem 0}
  .gate button{width:100%;padding:.7rem;font:inherit;border:none;border-radius:10px;background:var(--pine);color:#fff}
  .empty{color:var(--ink3);text-align:center;padding:2rem}
  .toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--pine);color:#fff;padding:.6rem 1rem;border-radius:10px;font-size:.85rem;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.on{opacity:1}
  .btn.d{color:#A8402F;border-color:rgba(168,64,47,.45)}
  .btn.d:hover{border-color:#A8402F}
  .fbx{display:flex;flex-wrap:wrap;gap:.4rem;margin:.3rem 0 .5rem}
  .fbi{font-size:.78rem;background:#FBF3DF;color:#5A4A1E;border-radius:8px;padding:.25rem .55rem}
  .fbi small{color:#8A7A4E}
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <h2>כניסת ניהול</h2>
  <input type="password" id="keyIn" placeholder="מפתח גישה" autocomplete="off">
  <button id="keyGo">כניסה</button>
  <p class="err" id="keyErr"></p>
  <p style="font-size:.75rem"><a href="admin-login.html" style="color:var(--gold)">או כניסה עם קוד</a></p>
</div>
<main class="wrap" id="main" hidden>
  <h1>לקוחות</h1>
  <p class="sub">כל אירוע ששולם, החדש למעלה. מכאן נכנסים לדשבורד ולהעלאה של הלקוח, מחליפים רשימה, ונותנים תוספות בחינם.</p>
  <div class="bar">
    <select id="fActive"><option value="all">הכל</option><option value="active">פעילים</option><option value="inactive">לא פעילים</option></select>
    <input type="search" id="q" placeholder="חיפוש: שם, טלפון, אירוע">
    <span class="meta" id="count"></span>
  </div>
  <div id="list"></div>
  <p class="empty" id="empty" hidden>אין אירועים.</p>
</main>
<div class="toast" id="toast"></div>
<script>
(function () {
  var fb = {};
  var CFG = window.ISHUR_CONFIG, $ = function (id) { return document.getElementById(id); };
  var adminKey = '';
  var qk = new URLSearchParams(location.search).get('key');
  if (qk) { try { localStorage.setItem('ishur_calls_key', qk); } catch (e) {} history.replaceState(null, '', location.pathname); }
  try { adminKey = localStorage.getItem('ishur_calls_key') || ''; } catch (e) {}
  var events = [], flags = {};

  function api(name, body) {
    var payload = Object.assign({ admin_key: adminKey }, body || {});
    return fetch(CFG.endpoint(name), { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(window.IshurGuard ? IshurGuard.stamp(payload) : payload) });
  }
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('on'); setTimeout(function () { el.classList.remove('on'); }, 1800); }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function when(e) { var d = Date.parse(e.paid_at || ''); return isNaN(d) ? 0 : d; }
  function heDate(iso) { var d = new Date(iso); return isNaN(d) ? (iso || '—') : d.toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit', year: '2-digit' }); }

  window.addEventListener('ishur:fresh', function () { load(); });
  function load() {
    api('status', { view: 'biz' }).then(function (r) {
      if (r.status === 403) { if (/^sess\./.test(adminKey) && (window.__k403 = (window.__k403 || 0) + 1) < 4) { setTimeout(load, 2500); return null; } localStorage.removeItem('ishur_calls_key'); gate('המפתח לא נכון'); return null; }
      return r.json();
    }).then(function (d) {
      if (!d) return;
      $('gate').hidden = true; $('main').hidden = false;
      events = (d.events || []).slice().sort(function (a, b) { return when(b) - when(a); });
      api('feedback-list', {}).then(function (r) { return r.json(); }).then(function (f) { fb = {}; ((f && f.feedback) || []).forEach(function (x) { (fb[x.token] = fb[x.token] || []).push(x); }); render(); }).catch(function () {});
      return api('client-flags', { tokens: events.map(function (e) { return e.token; }) }).then(function (r) { return r.json(); }).then(function (f) { flags = (f && f.flags) || {}; render(); });
    }).catch(function () { $('main').hidden = false; $('list').innerHTML = '<p class="empty">לא הצלחנו לטעון</p>'; });
  }

  function render() {
    var f = $('fActive').value, q = ($('q').value || '').trim();
    var rows = events.filter(function (e) {
      var fl = flags[e.token] || { active: true };
      if (f === 'active' && !fl.active) return false;
      if (f === 'inactive' && fl.active) return false;
      if (q && !((e.client || '') + ' ' + (e.name || '') + ' ' + (e.phone || '') + ' ' + (e.occasion || '')).includes(q)) return false;
      return true;
    });
    $('count').textContent = rows.length + ' אירועים';
    $('empty').hidden = !!rows.length;
    $('list').innerHTML = rows.map(function (e) {
      var fl = flags[e.token] || { active: true };
      var t = e.token;
      return '<div class="card' + (fl.active ? '' : ' inactive') + '" data-t="' + t + '">' +
        '<div class="top"><span class="name">' + esc(e.client || e.name || '—') + ' <span class="meta">· ' + esc(e.name || e.occasion || '') + '</span></span>' +
        '<span class="meta">שולם ' + heDate(e.paid) + (e.date ? ' · אירוע ' + esc(e.date) : '') + ' · ' + esc(e.plan || '') + (e.tier ? ' עד ' + e.tier : '') + (e.sum ? ' · ₪' + e.sum : '') + '</span></div>' +
        '<div class="tags">' +
          (fl.hold ? '' : '<span class="tag ' + (fl.active ? 'on' : 'warn') + '">' + (fl.active ? 'פעיל' : 'לא פעיל') + '</span>') +
          '<span class="tag ' + (e.file_uploaded ? 'on' : 'warn') + '">' + (e.file_uploaded ? 'רשימה הועלתה' : 'אין רשימה') + '</span>' +
          (fl.sent ? '<span class="tag on">הזמנות יצאו</span>' : '<span class="tag">טרם נשלח</span>') +
          (fl.video ? '<span class="tag on">וידאו</span>' : '') +
          (fl.addon ? '<span class="tag">+' + fl.addon + ' מוזמנים</span>' : '') +
          (fl.extrasend ? '<span class="tag">שליחה נוספת</span>' : '') +
          (fl.calls ? '<span class="tag">סבב שיחות</span>' : '') +
          (e.cancelled ? '<span class="tag warn">בוטל</span>' : '') +
          (fl.hold ? '<span class="tag warn">מבוטל · אין שליחות</span>' : '') +
        '</div>' +
        ((fb[t] || []).length ? '<div class="fbx">' + fb[t].map(function (x) {
          return '<span class="fbi"><b>' + (x.who === 2 ? 'בן/בת זוג' : 'הלקוח') + '</b> ' +
            (x.nps ? 'ימליץ ' + x.nps + '/10 · חוויה ' + x.exp + '/10' : 'פתח/ה את הטופס') +
            (x.clicked_clip ? ' · לחץ על המלצה' : '') + (x.note ? ' · "' + esc(x.note.slice(0, 160)) + '"' : '') +
            (x.at ? ' <small>' + esc(String(x.at).slice(0, 10).split('-').reverse().join('.')) + '</small>' : '') + '</span>';
        }).join('') + '</div>' : '') +
        '<div class="acts">' +
          '<a class="btn p" href="dashboard.html?t=' + t + '" target="_blank">הדשבורד שלו</a>' +
          '<button class="btn" data-act="fblinks">קישורי משוב</button>' +
          '<a class="btn" href="upload.html?t=' + t + '" target="_blank">העלאה והגדרות</a>' +
          '<button class="btn" data-act="link-dashboard">📲 שלח קישור ללוח</button>' +
          '<button class="btn" data-act="link-upload">📲 שלח קישור להעלאה</button>' +
          '<button class="btn" data-act="reset">איפוס רשימה להעלאה מחדש</button>' +
          '<button class="btn g" data-act="guests">+50 מוזמנים חינם</button>' +
          '<button class="btn g" data-act="extrasend">שליחה נוספת חינם</button>' +
          '<button class="btn g" data-act="calls">סבב שיחות חינם</button>' +
          '<button class="btn" data-act="active">' + (fl.active ? 'סמן לא פעיל' : 'סמן פעיל') + '</button>' +
          '<button class="btn' + (fl.hold ? '' : ' d') + '" data-act="hold">' + (fl.hold ? 'חידוש הלקוח' : 'ביטול לקוח') + '</button>' +
          '<span class="meta" dir="ltr">' + esc(e.phone || '') + '</span>' +
        '</div></div>';
    }).join('');
  }

  $('list').addEventListener('click', async function (ev) {
    var b = ev.target.closest('button[data-act]'); if (!b) return;
    var t = b.closest('.card').dataset.t, act = b.dataset.act, fl = flags[t] || { active: true };
    var e = events.filter(function (x) { return x.token === t; })[0] || {};
    b.disabled = true;
    var p;
    if (act === 'link-dashboard' || act === 'link-upload') {
      var kind = act === 'link-upload' ? 'upload' : 'dashboard';
      p = api('client-link', { token: t, kind: kind }).then(function (r) { return r.json(); }).then(function (j) { toast(j.ok ? 'נשלח ללקוח בוואטסאפ (' + (j.via === 'button' ? 'עם כפתור' : 'תבנית') + ')' : 'לא נשלח' + (j.error ? ': ' + j.error : '')); });
    } else if (act === 'reset') {
      if (!(await askConfirm('הלקוח (או אתה) יעלה רשימה מחדש. אם ההזמנות כבר יצאו, זה ייחסם.', { title: 'למחוק את רשימת המוזמנים?', ok: 'כן, למחוק', danger: true }))) { b.disabled = false; return; }
      p = api('guests-reset', { token: t }).then(function (r) { return r.json(); }).then(function (j) { toast(j.ok ? 'נמחקו ' + j.deleted + ' שורות. אפשר להעלות מחדש' : (j.error === 'already-sent' ? 'ההזמנות כבר יצאו, אפשר רק להוסיף' : 'לא הצליח')); });
    } else if (act === 'fblinks') {
      var l1 = 'https://ishur.io/feedback.html?t=' + t, l2 = l1 + '&p=2';
      try { await navigator.clipboard.writeText('משוב: ' + l1 + '\nבן/בת הזוג: ' + l2); toast('שני הקישורים הועתקו'); } catch (e2) { prompt('קישורי המשוב', l1 + '  |  ' + l2); }
      b.disabled = false; return;
    } else if (act === 'hold') {
      /* Richard 14/10: stop every send and call for this event without touching the sheet; reversible */
      var toHold = !fl.hold;
      if (toHold && !(await askConfirm('כל השליחות והשיחות לאירוע הזה נעצרות, כולל הודעות לאורחים. שום דבר לא יוצא עד שתחדש. הרשימה והתאריכים נשארים.', { title: 'לבטל את הלקוח?', ok: 'כן, לבטל', danger: true }))) { b.disabled = false; return; }
      p = api('eventflag', { token: t, flag: 'hold', on: toHold }).then(function (r) { return r.json(); }).then(function (j) { if (j.ok) { flags[t] = Object.assign(fl, { hold: j.on, active: !j.on }); api('client-active', { token: t, active: !j.on }); toast(j.on ? 'הלקוח בוטל, שום דבר לא יוצא' : 'הלקוח חודש'); render(); } else toast('לא הצליח'); });
    } else if (act === 'active') {
      p = api('client-active', { token: t, active: !fl.active }).then(function (r) { return r.json(); }).then(function (j) { if (j.ok) { flags[t] = Object.assign(fl, { active: j.active }); render(); } });
    } else {
      var kind = act, n = act === 'guests' ? 50 : undefined;
      if (!(await askConfirm('לתת ללקוח ' + b.textContent + '?', { title: 'תוספת חינם', ok: 'כן, לתת' }))) { b.disabled = false; return; }
      p = api('grant-addon', { token: t, kind: kind, n: n }).then(function (r) { return r.json(); }).then(function (j) { toast(j.ok ? 'ניתן' : 'לא הצליח'); return api('client-flags', { tokens: [t] }).then(function (r) { return r.json(); }).then(function (f) { flags[t] = (f.flags || {})[t] || fl; render(); }); });
    }
    p.catch(function () { toast('שגיאה'); }).then(function () { b.disabled = false; });
  });
  $('fActive').addEventListener('change', render);
  $('q').addEventListener('input', render);

  function gate(err) { $('gate').hidden = false; $('main').hidden = true; $('keyErr').textContent = err || ''; }
  $('keyGo').addEventListener('click', function () { adminKey = $('keyIn').value.trim(); if (!adminKey) return; localStorage.setItem('ishur_calls_key', adminKey); load(); });
  $('keyIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('keyGo').click(); });
  if (adminKey) load(); else gate();
})();
</script>
</body>
</html>
