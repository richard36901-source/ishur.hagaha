<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>מוקד שיחות · ishur.io</title>
<link rel="icon" type="image/png" sizes="128x128" href="assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700&family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js?v=19"></script>
<script src="assets/guard.js?v=19"></script>
<style>
  :root{
    --pine:#0F2E22; --pine-deep:#0A2119; --navy:#16233A;
    --gold:#A8853C; --gold-soft:#C7AE7A; --gold-pale:rgba(199,174,122,.3);
    --paper:#F8F4EA; --ink:#1B2420; --ink2:#4A554E; --ink3:#7A847C;
    --bg:#FAF8F1; --card:#fff; --line:#E3E1D8;
    --ok:#0F4C35; --no:#A8402F; --maybe:#8A6D1F; --redial:#3D5A80;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Heebo',system-ui,sans-serif;background:var(--bg);color:var(--ink);direction:rtl;line-height:1.55;padding-bottom:4rem}
  .head{background:radial-gradient(130% 140% at 50% -30%,#17402F 0%,var(--pine) 60%,var(--pine-deep) 100%);color:var(--paper);padding:1.1rem 1rem 1.2rem;text-align:center;border-bottom:1px solid var(--gold-pale)}
  .head h1{font-family:'Frank Ruhl Libre',serif;font-size:1.35rem}
  .head h1 i{font-style:normal;color:var(--gold-soft)}
  .head p{font-size:.78rem;color:rgba(248,244,234,.65)}
  .wrap{max-width:640px;margin:0 auto;padding:0 .9rem}
  .sum{display:flex;gap:.6rem;margin:1rem 0}
  .kpi{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.6rem .4rem;text-align:center}
  .kpi b{display:block;font-size:1.3rem;color:var(--pine)}
  .kpi span{font-size:.7rem;color:var(--ink3)}
  .ev-h{font-family:'Frank Ruhl Libre',serif;font-size:1rem;color:var(--pine);margin:1.3rem 0 .5rem;padding-bottom:.3rem;border-bottom:1px solid var(--gold-soft)}
  .ev-h small{font-family:'Heebo';font-weight:400;color:var(--ink3);font-size:.76rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-bottom:.8rem;box-shadow:0 1px 3px rgba(15,46,34,.05)}
  .g-top{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}
  .g-name{font-weight:600;font-size:1.02rem}
  .g-party{font-size:.74rem;color:var(--ink3)}
  .g-tries{margin-inline-start:auto;font-size:.72rem;color:var(--ink3);background:#F1EFE8;border-radius:99px;padding:.1rem .55rem}
  .g-tries.warn{color:#8A5A00;background:rgba(168,133,60,.15)}
  .g-phone{display:inline-flex;align-items:center;gap:.45rem;margin:.45rem 0;font-size:1.05rem;font-weight:600;color:var(--pine);text-decoration:none;direction:ltr}
  .g-phone svg{flex-shrink:0}
  .g-last{font-size:.74rem;color:var(--ink3);margin-bottom:.2rem}
  .script{background:#F7F5EC;border:1px dashed var(--gold-pale);border-radius:10px;padding:.6rem .75rem;font-size:.85rem;color:var(--ink2);margin:.5rem 0 .7rem}
  .script b{color:var(--ink)}
  .btns{display:flex;gap:.45rem;flex-wrap:wrap}
  .btn{border:none;border-radius:9px;padding:.5rem .85rem;font:inherit;font-size:.84rem;font-weight:600;cursor:pointer;color:#fff;flex:1 1 auto;min-width:5.2rem}
  .btn:disabled{opacity:.5;cursor:wait}
  .b-yes{background:var(--ok)} .b-no{background:var(--no)}
  .b-maybe{background:var(--maybe)} .b-miss{background:#6B7280} .b-again{background:var(--redial)}
  .empty{text-align:center;color:var(--ink3);padding:3rem 1rem;font-size:.95rem}
  .empty b{display:block;font-family:'Frank Ruhl Libre',serif;font-size:1.2rem;color:var(--pine);margin-bottom:.3rem}
  .toast{position:fixed;bottom:1rem;right:50%;transform:translateX(50%);background:var(--pine);color:var(--paper);border-radius:99px;padding:.5rem 1.2rem;font-size:.85rem;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.on{opacity:1}
  .gate{max-width:340px;margin:4rem auto;text-align:center;padding:0 1rem}
  .gate input{width:100%;border:1px solid var(--line);border-radius:10px;padding:.7rem .9rem;font:inherit;margin:.8rem 0 .5rem;text-align:center;direction:ltr}
  .gate button{width:100%;border:none;border-radius:10px;background:var(--pine);color:var(--paper);padding:.7rem;font:inherit;font-weight:600;cursor:pointer}
  .gate p.err{color:var(--no);font-size:.8rem;min-height:1.2rem;margin-top:.4rem}
  .foot{text-align:center;font-size:.68rem;color:var(--gold);letter-spacing:.12em;text-transform:uppercase;margin-top:2.5rem;opacity:.75}
</style>
</head>
<body>
<header class="head">
  <h1>ishur<i>.io</i> · מוקד שיחות</h1>
  <p>מי שלא ענה להודעות — מחייגים, מסמנים, וזה נכתב ישר לגיליון</p>
</header>

<div class="gate" id="gate" hidden>
  <h2 style="font-family:'Frank Ruhl Libre',serif;color:var(--pine)">כניסת מוקד</h2>
  <input type="password" id="keyIn" placeholder="מפתח גישה" autocomplete="off">
  <button id="keyGo">כניסה</button>
  <p class="err" id="keyErr"></p>
</div>

<main class="wrap" id="main" hidden>
  <div class="sum">
    <div class="kpi"><b id="k-due">–</b><span>ממתינים לשיחה</span></div>
    <div class="kpi"><b id="k-events">–</b><span>אירועים</span></div>
    <div class="kpi"><b id="k-done">0</b><span>טופלו עכשיו</span></div>
  </div>
  <div id="list"></div>
  <p class="foot">ishur.io · הדף כותב ישירות לגיליון האורחים</p>
</main>

<div class="toast" id="toast"></div>

<script>
(function () {
  var CFG = window.ISHUR_CONFIG;
  var $ = function (id) { return document.getElementById(id); };
  var MAX_TRIES = 3;
  var adminKey = '';
  var handled = 0;

  /* ── access key: URL once, localStorage afterwards ── */
  var qk = new URLSearchParams(location.search).get('key');
  if (qk) { localStorage.setItem('ishur_calls_key', qk); history.replaceState(null, '', location.pathname); }
  adminKey = localStorage.getItem('ishur_calls_key') || '';

  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('on');
    setTimeout(function () { t.classList.remove('on'); }, 1800);
  }

  function api(path, payload) {
    payload.admin_key = adminKey;
    return fetch(CFG.endpoint(path), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(window.IshurGuard ? IshurGuard.stamp(payload) : payload)
    });
  }

  function pretty(p) {
    var d = String(p || '').replace(/\D/g, '');
    if (d.slice(0, 3) === '972') d = '0' + d.slice(3);
    return d.replace(/^(\d{3})(\d{3})(\d{4})$/, '$1-$2-$3');
  }

  function heDate(iso) {
    if (!iso) return '';
    var p = iso.split('-');
    return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0] : iso;
  }

  function scriptFor(g) {
    var ev = g.occasion ? 'ה' + g.occasion : 'האירוע';
    var who = g.event_name && g.event_name !== g.client_name ? ' של <b>' + g.event_name + '</b>' : '';
    var where = [g.venue_name, g.venue_city].filter(Boolean).join(', ');
    return 'שלום <b>' + (g.name || '') + '</b>, מדברים מ״אישורי הגעה״ לגבי ' + ev + who +
      ' בתאריך <b>' + heDate(g.event_date) + '</b>' +
      (where ? ' ב<b>' + where + '</b>' : '') +
      (g.reception_time ? ' (קבלת פנים ' + g.reception_time + ')' : '') +
      '. שלחנו הזמנה בוואטסאפ ולא קיבלנו תשובה — האם תגיעו?' +
      (g.party ? ' <b>(' + g.party + ' מוזמנים)</b>' : '');
  }

  var OUTCOMES = [
    { label: 'מגיע', cls: 'b-yes', gone: true },
    { label: 'לא מגיע', cls: 'b-no', gone: true },
    { label: 'מתלבט', cls: 'b-maybe', gone: false },
    { label: 'לא ענה', cls: 'b-miss', gone: false },
    { label: 'לחייג שוב', cls: 'b-again', gone: false }
  ];

  function render(queue) {
    var list = $('list');
    list.innerHTML = '';
    var live = queue.filter(function (g) { return !g.capped; });
    $('k-due').textContent = live.length;
    var events = {};
    live.forEach(function (g) { events[g.token] = true; });
    $('k-events').textContent = Object.keys(events).length;

    if (!live.length) {
      list.innerHTML = '<div class="empty"><b>אין שיחות ממתינות</b>כשמישהו לא יענה להודעות — הוא יופיע כאן.</div>';
      return;
    }

    var lastToken = null;
    live.forEach(function (g) {
      if (g.token !== lastToken) {
        lastToken = g.token;
        var h = document.createElement('div');
        h.className = 'ev-h';
        h.innerHTML = (g.occasion || 'אירוע') + (g.event_name ? ' · ' + g.event_name : '') +
          ' <small>' + heDate(g.event_date) + (g.venue_city ? ' · ' + g.venue_city : '') + '</small>';
        list.appendChild(h);
      }

      var card = document.createElement('div');
      card.className = 'card';
      var triesCls = g.tries >= MAX_TRIES - 1 ? 'g-tries warn' : 'g-tries';
      card.innerHTML =
        '<div class="g-top"><span class="g-name">' + g.name + '</span>' +
        (g.party ? '<span class="g-party">' + g.party + ' מוזמנים</span>' : '') +
        '<span class="' + triesCls + '">שיחה ' + (g.tries + 1) + ' מתוך ' + MAX_TRIES + '</span></div>' +
        '<a class="g-phone" href="tel:+' + g.phone + '">' +
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>' +
        pretty(g.phone) + '</a>' +
        (g.last_answer ? '<div class="g-last">פעם קודמת: ' + g.last_answer + '</div>' : '') +
        '<div class="script">' + scriptFor(g) + '</div>' +
        '<div class="btns"></div>';

      var btns = card.querySelector('.btns');
      OUTCOMES.forEach(function (o) {
        var b = document.createElement('button');
        b.className = 'btn ' + o.cls;
        b.textContent = o.label;
        b.addEventListener('click', function () { mark(g, o, card, btns); });
        btns.appendChild(b);
      });
      list.appendChild(card);
    });
  }

  function mark(g, o, card, btns) {
    Array.prototype.forEach.call(btns.children, function (b) { b.disabled = true; });
    api('event', {
      event_type: 'call_result',
      guest_id: g.guest_id,
      outcome: o.label,
      tries: String(g.tries)
    }).then(function (r) {
      if (r.status !== 200) throw new Error('http ' + r.status);
      return r.json();
    }).then(function (j) {
      g.tries = Number(j.tries) || g.tries;
      handled++; $('k-done').textContent = handled;
      var removed = o.gone || (o.label === 'לא ענה' && g.tries >= MAX_TRIES);
      if (removed) {
        card.style.opacity = '0.35';
        setTimeout(function () { card.remove(); refreshCounts(); }, 350);
        toast(o.label === 'מגיע' ? 'סומן: מגיע ✓' : o.label === 'לא מגיע' ? 'סומן: לא מגיע' : 'ירד מהרשימה — מוצו הנסיונות');
      } else {
        g.last_answer = j.answer;
        var t = card.querySelector('.g-tries');
        t.textContent = 'שיחה ' + (g.tries + 1) + ' מתוך ' + MAX_TRIES;
        if (g.tries >= MAX_TRIES - 1) t.classList.add('warn');
        var last = card.querySelector('.g-last');
        if (last) last.textContent = 'פעם קודמת: ' + j.answer;
        toast('נשמר: ' + o.label);
        Array.prototype.forEach.call(btns.children, function (b) { b.disabled = false; });
      }
    }).catch(function () {
      toast('לא נשמר — נסו שוב');
      Array.prototype.forEach.call(btns.children, function (b) { b.disabled = false; });
    });
  }

  function refreshCounts() {
    $('k-due').textContent = document.querySelectorAll('#list .card').length;
  }

  function load() {
    api('status', {}).then(function (r) {
      if (r.status === 403) { localStorage.removeItem('ishur_calls_key'); gate('המפתח לא נכון'); return null; }
      return r.json();
    }).then(function (j) {
      if (!j) return;
      MAX_TRIES = j.max_tries || 3;
      $('gate').hidden = true; $('main').hidden = false;
      render(j.queue || []);
    }).catch(function () {
      $('main').hidden = false;
      $('list').innerHTML = '<div class="empty"><b>לא הצלחנו לטעון</b>רעננו את הדף ונסו שוב.</div>';
    });
  }

  function gate(err) {
    $('gate').hidden = false; $('main').hidden = true;
    $('keyErr').textContent = err || '';
  }
  $('keyGo').addEventListener('click', function () {
    adminKey = $('keyIn').value.trim();
    if (!adminKey) return;
    localStorage.setItem('ishur_calls_key', adminKey);
    load();
  });
  $('keyIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('keyGo').click(); });

  if (adminKey) load(); else gate();
})();
</script>
</body>
</html>
